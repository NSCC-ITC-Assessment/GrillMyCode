<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="gmc-resub-title">
  <title id="gmc-resub-title">What happens when a student resubmits a tag. The student pushes the phase1 tag, then later moves it to a newer commit and pushes it again. On the student's side, the same issue is updated: its questions are replaced and its link stays the same. In your private repository, in the student's phase1 folder: questions.md holds the new questions and says this is the 2nd submission of phase1; submissions.md lists both submissions; and history/1-questions.md keeps the first set of questions. A run you start yourself is listed in submissions.md, but not counted as a submission.</title>
  <style>
    .txt{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .ttl{font-size:19px;font-weight:800;fill:#1E293B}
    .sub{font-size:14px;font-weight:600;fill:#475569}
    .file{font-size:14px;font-weight:700;fill:#1E293B}
    .note{font-size:13px;font-weight:600;fill:#334155}
    .ink{stroke:#1E293B;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
  </style>
  <defs>
    <path id="gmc-resub-sparkle" d="M0,-10 C1,-3 3,-1 10,0 C3,1 1,3 0,10 C-1,3 -3,1 -10,0 C-3,-1 -1,-3 0,-10 Z"/>
    <circle id="gmc-resub-push" r="7" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/>
    <!-- a phase1 tag flag, its pole foot at 0,0 -->
    <g id="gmc-resub-tag">
      <line class="ink" x1="0" y1="-10" x2="0" y2="-40" stroke-width="2.5"/>
      <path class="ink" fill="#0D9488" stroke-width="2.5" d="M0,-72 H64 A6,6 0 0 1 70,-66 V-46 A6,6 0 0 1 64,-40 H0 L-12,-56 Z"/>
      <circle cx="2" cy="-56" r="3.5" fill="#FFF7ED"/>
      <text x="36" y="-50" text-anchor="middle" font-size="14" font-weight="800" fill="#FFFFFF" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif">phase1</text>
      <circle class="ink" r="11" fill="#0D9488" stroke-width="2.5"/>
    </g>
    <!-- a file, top-left at 0,0 -->
    <g id="gmc-resub-doc">
      <path class="ink" fill="#FFFFFF" stroke-width="2.2" d="M0,0 H15 L22,7 V28 H0 Z"/>
      <path d="M5,12 H17 M5,18 H14 M5,23 H16" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="gmc-resub-yes">
      <circle r="9" fill="#16A34A"/>
      <path d="M-4,0.5 L-1,3.5 L4.4,-3" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- backdrop: warm for the student, cool for you -->
  <rect x="0" y="0" width="1000" height="620" rx="32" fill="#FFF7ED"/>
  <path d="M400,216 H980 A20,20 0 0 1 1000,236 V588 A32,32 0 0 1 968,620 H400 Z" fill="#EFF6FF"/>
  <g fill="#FFC53A">
    <use href="#gmc-resub-sparkle" transform="translate(300,48) scale(.7)"/>
    <use href="#gmc-resub-sparkle" transform="translate(966,196) scale(.6)"/>
  </g>

  <!-- ===== the student ===== -->
  <g transform="translate(-40,-386)">
    <path class="ink" fill="#F97316" d="M62,548 C62,510 80,496 106,496 C132,496 150,510 150,548 Z"/>
    <path class="ink" fill="#FDDCB5" d="M98,478 V497 Q106,503 114,497 V478 Z"/>
    <g transform="translate(106,490) scale(.86) translate(-106,-492)">
      <path class="ink" fill="#5B3A29" d="M75,468 C72,434 92,422 108,422 C126,422 142,434 138,468 C138,484 141,494 147,502 C136,506 128,502 124,496 L88,496 C84,502 76,506 66,502 C71,494 75,484 75,468 Z"/>
      <ellipse class="ink" cx="106" cy="464" rx="24" ry="28" fill="#FDDCB5"/>
      <path class="ink" fill="#5B3A29" d="M80,464 C76,436 94,428 110,430 C128,432 136,446 133,462 C120,458 106,450 98,440 C94,450 88,458 80,464 Z"/>
      <circle class="ink" cx="126" cy="442" r="4.2" fill="#FFC53A" stroke-width="2.5"/>
      <circle cx="96" cy="467" r="2.6" fill="#1E293B"/><circle cx="116" cy="467" r="2.6" fill="#1E293B"/>
      <path class="ink" fill="none" stroke-width="2.6" d="M100,479 Q106,483 112,479"/>
      <path d="M90,459 Q96,456 101,458.5 M111,458.5 Q116,456 122,459" fill="none" stroke="#1E293B" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M107.0,470 Q104.0,475 107.0,476" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round" stroke-opacity=".5"/>
    </g>
  </g>
  <g class="txt">
    <text class="ttl" x="140" y="98">The student</text>
    <text class="ttl" x="140" y="121">resubmits phase1</text>
  </g>

  <!-- timeline road -->
  <path d="M360,140 H960" fill="none" stroke="#FCD9B6" stroke-width="22" stroke-linecap="round"/>
  <path d="M360,140 H960" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="10 12" stroke-linecap="round"/>
  <path class="ink" fill="none" d="M946,130 L960,140 L946,150" stroke="#C2410C"/>
  <use href="#gmc-resub-push" x="400" y="140"/>
  <use href="#gmc-resub-push" x="460" y="140"/>
  <use href="#gmc-resub-push" x="620" y="140"/>
  <use href="#gmc-resub-push" x="680" y="140"/>
  <use href="#gmc-resub-push" x="740" y="140"/>

  <!-- first push of the tag, faded once it has moved -->
  <g opacity=".45"><use href="#gmc-resub-tag" x="530" y="140"/></g>
  <!-- the tag, moved and pushed again -->
  <use href="#gmc-resub-tag" x="810" y="140"/>
  <path d="M606,74 Q700,30 790,64" fill="none" stroke="#0D9488" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>
  <path d="M778,56 L792,66 L776,72" fill="none" stroke="#0D9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="txt sub" text-anchor="middle">
    <text x="530" y="176">1st submission</text>
    <text x="810" y="176">moved and pushed again:</text>
    <text x="810" y="194">2nd submission</text>
  </g>

  <!-- ===== the student's side ===== -->
  <g class="txt">
    <text class="ttl" x="40" y="252">What the student sees</text>
    <text class="sub" x="40" y="274">in their own repository</text>
  </g>
  <!-- the issue -->
  <g class="txt">
    <rect x="52" y="302" width="316" height="192" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2.5" transform="rotate(-3 210 398)"/>
    <rect class="ink" x="44" y="296" width="316" height="192" rx="14" fill="#FFFFFF"/>
    <path d="M44,336 H360" stroke="#1E293B" stroke-width="2.5"/>
    <circle cx="66" cy="316" r="8" fill="#16A34A"/>
    <circle cx="66" cy="316" r="3" fill="#FFFFFF"/>
    <text x="82" y="321" font-size="12" font-weight="800" fill="#1E293B">GrillMyCode Questions (tag: phase1)</text>
    <g stroke-linecap="round" stroke-width="4">
      <path d="M64,362 H84" stroke="#FB923C"/><path d="M94,362 H300" stroke="#CBD5E1"/>
      <path d="M64,390 H84" stroke="#FB923C"/><path d="M94,390 H270" stroke="#CBD5E1"/>
      <path d="M64,418 H84" stroke="#FB923C"/><path d="M94,418 H320" stroke="#CBD5E1"/>
      <path d="M64,446 H84" stroke="#FB923C"/><path d="M94,446 H250" stroke="#CBD5E1"/>
    </g>
    <rect class="ink" x="228" y="458" width="150" height="30" rx="15" fill="#FFC53A" stroke-width="2.5"/>
    <text x="303" y="478" text-anchor="middle" font-size="13" font-weight="800" fill="#7C2D12">new questions</text>
  </g>
  <g class="txt">
    <text class="sub" x="44" y="532">The same issue is updated.</text>
    <text class="sub" x="44" y="552">Its questions are replaced, and</text>
    <text class="sub" x="44" y="572">the link stays the same.</text>
  </g>

  <!-- ===== your side ===== -->
  <g class="txt">
    <text class="ttl" x="960" y="252" text-anchor="end">Your private repository</text>
    <text class="sub" x="960" y="274" text-anchor="end">students can't see it</text>
    <!-- padlock -->
    <g transform="translate(436,256)">
      <path d="M-9,-4 V-11 A9,9 0 0 1 9,-11 V-4" fill="none" stroke="#1E293B" stroke-width="3"/>
      <rect class="ink" x="-14" y="-4" width="28" height="22" rx="5" fill="#FFC53A" stroke-width="2.5"/>
      <circle cx="0" cy="6" r="3" fill="#1E293B"/>
    </g>
  </g>
  <!-- folder heading -->
  <g class="txt">
    <path class="ink" fill="#FDBA74" stroke-width="2.5" d="M430,300 H452 L458,306 H480 V326 H430 Z"/>
    <text class="mono file" x="492" y="319">jsmith/phase1/</text>
  </g>
  <path d="M446,332 V510 M446,366 H466 M446,440 H466 M446,510 H466" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- questions.md -->
  <use href="#gmc-resub-doc" x="472" y="352"/>
  <g class="txt">
    <text class="mono file" x="504" y="371">questions.md</text>
    <rect x="636" y="350" width="332" height="32" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <path d="M656,358 L666,375 H646 Z" fill="#F59E0B" stroke="#92400E" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M656,364 V369" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/><circle cx="656" cy="372.4" r="1.1" fill="#1E293B"/>
    <text class="note" x="676" y="371">resubmitted: the 2nd submission</text>
  </g>

  <!-- submissions.md -->
  <use href="#gmc-resub-doc" x="472" y="426"/>
  <g class="txt">
    <text class="mono file" x="504" y="445">submissions.md</text>
    <rect x="636" y="402" width="332" height="78" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    <text class="note" x="652" y="426">1</text><text class="note" x="676" y="426">tag push by the student</text>
    <use href="#gmc-resub-yes" x="946" y="421"/>
    <path d="M644,442 H960" stroke="#E2E8F0" stroke-width="2"/>
    <text class="note" x="652" y="464">2</text><text class="note" x="676" y="464">tag push by the student</text>
    <use href="#gmc-resub-yes" x="946" y="459"/>
    <text x="918" y="426" text-anchor="end" font-size="12" font-weight="700" fill="#15803D">counted</text>
    <text x="918" y="464" text-anchor="end" font-size="12" font-weight="700" fill="#15803D">counted</text>
  </g>

  <!-- history/1-questions.md -->
  <use href="#gmc-resub-doc" x="472" y="496"/>
  <g class="txt">
    <text class="mono file" x="504" y="515">history/1-questions.md</text>
    <text class="note" x="712" y="515">the 1st set of questions, kept</text>
  </g>

  <!-- footnote -->
  <g class="txt">
    <rect x="430" y="550" width="538" height="40" rx="20" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    <text class="note" x="699" y="575" text-anchor="middle">A run you start yourself is listed, but not counted.</text>
  </g>
</svg>
