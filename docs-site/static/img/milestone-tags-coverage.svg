<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="gmc-ms-title">
  <title id="gmc-ms-title">What each milestone tag asks about. A student's timeline has three tags: phase1, phase2 and final. With option 1, "All work to date is assessed", each tag's questions cover everything from the start, so the bars grow longer. With option 2, "Only work since the previous tag is assessed", each tag covers just the stretch since the tag before it. With option 3, "Only work since a tag you name is assessed", each stage has its own workflow that names the tag to start from: here the phase2 and final workflows both name phase1, so final covers everything after phase1. Starter code is never included.</title>
  <style>
    .txt{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .ttl{font-size:18px;font-weight:800;fill:#1E293B}
    .sub{font-size:14px;font-weight:600;fill:#475569}
    .bar{font-size:14px;font-weight:800;fill:#FFFFFF}
    .ink{stroke:#1E293B;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
    .guide{stroke:#FCD9B6;stroke-width:2.5;stroke-dasharray:3 7;stroke-linecap:round}
  </style>
  <defs>
    <linearGradient id="gmc-ms-flame" x1="205" y1="60" x2="120" y2="295" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FA7A18"/><stop offset="0.45" stop-color="#F13B1F"/><stop offset="1" stop-color="#C8142E"/>
    </linearGradient>
    <linearGradient id="gmc-ms-core" x1="0" y1="140" x2="0" y2="298" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC53A"/><stop offset="1" stop-color="#FB8420"/>
    </linearGradient>
    <path id="gmc-ms-sparkle" d="M0,-10 C1,-3 3,-1 10,0 C3,1 1,3 0,10 C-1,3 -3,1 -10,0 C-3,-1 -1,-3 0,-10 Z"/>
    <!-- one run: a small flame with a face, centred on 0,0 -->
    <g id="gmc-ms-run">
      <g transform="scale(.16) translate(-180,-190)">
        <path class="ink" stroke-width="16" fill="url(#gmc-ms-flame)" d="M184 54C206 80 222 112 214 150C211 164 210 176 214 188C224 180 234 170 237 158C252 180 259 200 258 226C257 268 224 298 180 299C136 299 101 268 101 226C101 186 124 158 152 132C170 114 180 90 184 54Z"/>
        <path fill="url(#gmc-ms-core)" d="M188 138C186 170 184 196 192 214C214 228 223 248 221 266C219 284 210 294 204 298H156C142 290 129 272 129 250C129 212 170 176 188 138Z"/>
        <circle cx="160" cy="226" r="14" fill="#1E293B"/><circle cx="202" cy="226" r="14" fill="#1E293B"/>
        <path d="M164,254 Q181,272 198,254" fill="none" stroke="#1E293B" stroke-width="10" stroke-linecap="round"/>
      </g>
    </g>
    <circle id="gmc-ms-push" r="7" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1000" height="720" rx="32" fill="#FFF7ED"/>
  <g fill="#FFC53A">
    <use href="#gmc-ms-sparkle" transform="translate(250,40) scale(.7)"/>
    <use href="#gmc-ms-sparkle" transform="translate(965,200) scale(.6)"/>
  </g>

  <!-- ===== the student ===== -->
  <g transform="translate(-40,-376)">
    <path class="ink" fill="#F97316" d="M62,548 C62,510 80,496 106,496 C132,496 150,510 150,548 Z"/>
    <path class="ink" fill="#FDDCB5" d="M98,478 V497 Q106,503 114,497 V478 Z"/>
    <g transform="translate(106,490) scale(.86) translate(-106,-492)">
      <path class="ink" fill="#5B3A29" d="M75,468 C72,434 92,422 108,422 C126,422 142,434 138,468 C138,484 141,494 147,502 C136,506 128,502 124,496 L88,496 C84,502 76,506 66,502 C71,494 75,484 75,468 Z"/>
      <ellipse class="ink" cx="106" cy="464" rx="24" ry="28" fill="#FDDCB5"/>
      <path class="ink" fill="#5B3A29" d="M80,464 C76,436 94,428 110,430 C128,432 136,446 133,462 C120,458 106,450 98,440 C94,450 88,458 80,464 Z"/>
      <circle class="ink" cx="126" cy="442" r="4.2" fill="#FFC53A" stroke-width="2.5"/>
      <circle cx="96" cy="467" r="2.6" fill="#1E293B"/><circle cx="116" cy="467" r="2.6" fill="#1E293B"/>
      <path class="ink" fill="none" stroke-width="2.6" d="M100,479 Q106,483 112,479"/>
      <path d="M90,459 Q96,456 101,458.5 M111,458.5 Q116,456 122,459" fill="none" stroke="#1E293B" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M107.0,470 Q104.0,475 107.0,476" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round" stroke-opacity=".5"/>
    </g>
  </g>
  <text class="txt ttl" x="140" y="110">The student tags</text>
  <text class="txt ttl" x="140" y="132">each stage</text>

  <!-- guides down from the start and each tag -->
  <g class="guide">
    <line x1="330" y1="164" x2="330" y2="660"/>
    <line x1="500" y1="164" x2="500" y2="660"/>
    <line x1="700" y1="164" x2="700" y2="660"/>
    <line x1="900" y1="164" x2="900" y2="660"/>
  </g>

  <!-- timeline road -->
  <path d="M330,150 H960" fill="none" stroke="#FCD9B6" stroke-width="22" stroke-linecap="round"/>
  <path d="M330,150 H960" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="10 12" stroke-linecap="round"/>
  <path class="ink" fill="none" d="M946,140 L960,150 L946,160" stroke="#C2410C"/>

  <!-- start -->
  <g class="txt">
    <circle class="ink" cx="330" cy="150" r="13" fill="#1E293B"/>
    <path d="M325,144 L337,150 L325,156 Z" fill="#FFFFFF"/>
    <text class="sub" x="330" y="190" text-anchor="middle">start</text>
  </g>

  <!-- ordinary pushes -->
  <use href="#gmc-ms-push" x="390" y="150"/>
  <use href="#gmc-ms-push" x="445" y="150"/>
  <use href="#gmc-ms-push" x="570" y="150"/>
  <use href="#gmc-ms-push" x="635" y="150"/>
  <use href="#gmc-ms-push" x="770" y="150"/>
  <use href="#gmc-ms-push" x="835" y="150"/>

  <!-- tags -->
  <g class="txt">
    <line class="ink" x1="500" y1="140" x2="500" y2="100"/>
    <circle class="ink" cx="500" cy="150" r="11" fill="#0D9488"/>
    <path class="ink" fill="#0D9488" d="M500,64 H570 A6,6 0 0 1 576,70 V96 A6,6 0 0 1 570,102 H500 L487,83 Z"/>
    <circle cx="502" cy="83" r="3.5" fill="#FFF7ED"/>
    <text class="bar" x="539" y="89" text-anchor="middle">phase1</text>

    <line class="ink" x1="700" y1="140" x2="700" y2="100"/>
    <circle class="ink" cx="700" cy="150" r="11" fill="#7C3AED"/>
    <path class="ink" fill="#7C3AED" d="M700,64 H770 A6,6 0 0 1 776,70 V96 A6,6 0 0 1 770,102 H700 L687,83 Z"/>
    <circle cx="702" cy="83" r="3.5" fill="#FFF7ED"/>
    <text class="bar" x="739" y="89" text-anchor="middle">phase2</text>

    <line class="ink" x1="900" y1="140" x2="900" y2="100"/>
    <circle class="ink" cx="900" cy="150" r="11" fill="#EA580C"/>
    <path class="ink" fill="#EA580C" d="M900,64 H954 A6,6 0 0 1 960,70 V96 A6,6 0 0 1 954,102 H900 L887,83 Z"/>
    <circle cx="902" cy="83" r="3.5" fill="#FFF7ED"/>
    <text class="bar" x="931" y="89" text-anchor="middle">final</text>
  </g>

  <!-- ===== option 1: all work to date ===== -->
  <rect x="20" y="210" width="960" height="146" rx="22" fill="#FFFFFF" fill-opacity=".75"/>
  <g class="txt">
    <rect x="44" y="224" width="82" height="24" rx="12" fill="#C2410C"/>
    <text x="85" y="241" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">Option 1</text>
    <text class="ttl" x="44" y="268">All work to date</text>
    <text class="ttl" x="44" y="289">is assessed</text>
    <text class="sub" x="44" y="311">the default: each stage asks</text>
    <text class="sub" x="44" y="329">about everything so far</text>
  </g>
  <g class="txt">
    <rect class="ink" x="330" y="226" width="170" height="30" rx="15" fill="#0D9488" stroke-width="2.5"/>
    <text class="bar" x="346" y="246">phase1</text>
    <rect class="ink" x="330" y="268" width="370" height="30" rx="15" fill="#7C3AED" stroke-width="2.5"/>
    <text class="bar" x="346" y="288">phase2</text>
    <rect class="ink" x="330" y="310" width="570" height="30" rx="15" fill="#EA580C" stroke-width="2.5"/>
    <text class="bar" x="346" y="330">final</text>
  </g>
  <use href="#gmc-ms-run" x="518" y="241"/>
  <use href="#gmc-ms-run" x="718" y="283"/>
  <use href="#gmc-ms-run" x="918" y="325"/>

  <!-- ===== option 2: only work since the previous tag ===== -->
  <rect x="20" y="374" width="960" height="112" rx="22" fill="#FFFFFF" fill-opacity=".75"/>
  <g class="txt">
    <rect x="44" y="384" width="82" height="24" rx="12" fill="#C2410C"/>
    <text x="85" y="401" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">Option 2</text>
    <text class="ttl" x="44" y="426">Only work since the</text>
    <text class="ttl" x="44" y="447">previous tag is assessed</text>
    <text class="sub" x="44" y="468">each stage asks about its new code</text>
  </g>
  <g class="txt">
    <rect class="ink" x="330" y="416" width="166" height="30" rx="15" fill="#0D9488" stroke-width="2.5"/>
    <text class="bar" x="346" y="436">phase1</text>
    <rect class="ink" x="504" y="416" width="192" height="30" rx="15" fill="#7C3AED" stroke-width="2.5"/>
    <text class="bar" x="520" y="436">phase2</text>
    <rect class="ink" x="704" y="416" width="196" height="30" rx="15" fill="#EA580C" stroke-width="2.5"/>
    <text class="bar" x="720" y="436">final</text>
  </g>
  <use href="#gmc-ms-run" x="480" y="398"/>
  <use href="#gmc-ms-run" x="680" y="398"/>
  <use href="#gmc-ms-run" x="880" y="398"/>

  <!-- ===== option 3: only work since a tag you name ===== -->
  <rect x="20" y="504" width="960" height="146" rx="22" fill="#FFFFFF" fill-opacity=".75"/>
  <g class="txt">
    <rect x="44" y="518" width="82" height="24" rx="12" fill="#C2410C"/>
    <text x="85" y="535" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">Option 3</text>
    <text class="ttl" x="44" y="562">Only work since a</text>
    <text class="ttl" x="44" y="583">tag you name is assessed</text>
    <text class="sub" x="44" y="605">each stage has its own workflow</text>
    <text class="sub" x="44" y="623">that names where to start</text>
  </g>
  <g class="txt">
    <text class="sub" x="488" y="572" text-anchor="end" style="fill:#0D9488">you name</text>
    <text class="sub" x="488" y="590" text-anchor="end" style="fill:#0D9488">phase1 →</text>
    <rect class="ink" x="504" y="540" width="192" height="30" rx="15" fill="#7C3AED" stroke-width="2.5"/>
    <text class="bar" x="520" y="560">phase2, from phase1</text>
    <rect class="ink" x="504" y="582" width="396" height="30" rx="15" fill="#EA580C" stroke-width="2.5"/>
    <text class="bar" x="520" y="602">final, from phase1</text>
  </g>
  <use href="#gmc-ms-run" x="714" y="555"/>
  <use href="#gmc-ms-run" x="918" y="597"/>

  <!-- footnote -->
  <text class="txt sub" x="500" y="692" text-anchor="middle">Each tag gets its own set of questions. Your starter code is never included.</text>
</svg>
