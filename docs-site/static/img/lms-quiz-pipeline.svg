<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 412" role="img" aria-labelledby="gmc-quiz-title">
  <title id="gmc-quiz-title">How a student's quiz is made, in four steps. 1: the student's questions arrive in your private repository. 2: the quiz is built automatically, within a few minutes; a question without three wrong answers is left out. 3: two quiz files appear: an .imscc file for any LMS, and a .csv file for Brightspace only. 4: you import the quiz into your LMS.</title>
  <style>
    .txt{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .ttl{font-size:18px;font-weight:800;fill:#1E293B}
    .sub{font-size:14px;font-weight:600;fill:#475569}
    .num{font-size:18px;font-weight:800;fill:#FFFFFF}
    .ink{stroke:#1E293B;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
  </style>
  <defs>
    <linearGradient id="gmc-quiz-flame" x1="205" y1="60" x2="120" y2="295" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FA7A18"/><stop offset="0.45" stop-color="#F13B1F"/><stop offset="1" stop-color="#C8142E"/>
    </linearGradient>
    <linearGradient id="gmc-quiz-core" x1="0" y1="140" x2="0" y2="298" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC53A"/><stop offset="1" stop-color="#FB8420"/>
    </linearGradient>
    <path id="gmc-quiz-sparkle" d="M0,-10 C1,-3 3,-1 10,0 C3,1 1,3 0,10 C-1,3 -3,1 -10,0 C-3,-1 -1,-3 0,-10 Z"/>
    <!-- a small flame with a face, centred on 0,0 -->
    <g id="gmc-quiz-run">
      <g transform="scale(.19) translate(-180,-190)">
        <path class="ink" stroke-width="14" fill="url(#gmc-quiz-flame)" d="M184 54C206 80 222 112 214 150C211 164 210 176 214 188C224 180 234 170 237 158C252 180 259 200 258 226C257 268 224 298 180 299C136 299 101 268 101 226C101 186 124 158 152 132C170 114 180 90 184 54Z"/>
        <path fill="url(#gmc-quiz-core)" d="M188 138C186 170 184 196 192 214C214 228 223 248 221 266C219 284 210 294 204 298H156C142 290 129 272 129 250C129 212 170 176 188 138Z"/>
        <circle cx="160" cy="226" r="13" fill="#1E293B"/><circle cx="202" cy="226" r="13" fill="#1E293B"/>
        <path d="M164,254 Q181,272 198,254" fill="none" stroke="#1E293B" stroke-width="9" stroke-linecap="round"/>
      </g>
    </g>
    <path id="gmc-quiz-arrow" class="ink" fill="#FDBA74" stroke-width="2.5" d="M0,-8 H18 V-18 L38,0 L18,18 V8 H0 Z"/>
    <!-- a file with a coloured extension band, centred on 0,0 -->
    <g id="gmc-quiz-page">
      <path class="ink" fill="#FFFFFF" stroke-width="2.5" d="M-34,-44 H18 L34,-28 V44 H-34 Z"/>
      <path class="ink" fill="#E2E8F0" stroke-width="2.5" d="M18,-44 V-28 H34"/>
      <path d="M-22,-24 H8 M-22,-12 H20 M-22,0 H14" stroke="#CBD5E1" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1000" height="412" rx="32" fill="#FFF7ED"/>
  <g fill="#FFC53A">
    <use href="#gmc-quiz-sparkle" transform="translate(500,40) scale(.6)"/>
    <use href="#gmc-quiz-sparkle" transform="translate(966,384) scale(.6)"/>
  </g>

  <!-- ===== number badges ===== -->
  <g class="txt" text-anchor="middle">
    <circle class="ink" cx="40" cy="44" r="18" fill="#C2410C" stroke-width="2.5"/><text class="num" x="40" y="50">1</text>
    <circle class="ink" cx="290" cy="44" r="18" fill="#C2410C" stroke-width="2.5"/><text class="num" x="290" y="50">2</text>
    <circle class="ink" cx="540" cy="44" r="18" fill="#C2410C" stroke-width="2.5"/><text class="num" x="540" y="50">3</text>
    <circle class="ink" cx="790" cy="44" r="18" fill="#C2410C" stroke-width="2.5"/><text class="num" x="790" y="50">4</text>
  </g>

  <!-- ===== 1. the questions arrive in your private repository ===== -->
  <ellipse cx="125" cy="272" rx="100" ry="8" fill="#93C5FD" opacity=".45"/>
  <g class="txt">
    <!-- the student's questions sticking out of the folder -->
    <g transform="translate(118,150) rotate(-8)">
      <rect class="ink" x="-40" y="-50" width="80" height="96" rx="8" fill="#FFFFFF" stroke-width="2.5"/>
      <path d="M-28,-34 H24" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
      <path d="M-28,-18 H-18 M-12,-18 H26 M-28,-4 H-18 M-12,-4 H18" stroke-linecap="round" stroke-width="3.5" stroke="#CBD5E1"/>
      <path d="M-28,-18 H-18 M-28,-4 H-18" stroke-linecap="round" stroke-width="3.5" stroke="#FB923C"/>
    </g>
    <!-- folder -->
    <path class="ink" fill="#60A5FA" d="M44,164 H96 L108,178 H206 V268 H44 Z"/>
    <path class="ink" fill="#93C5FD" d="M44,192 H206 V268 H44 Z"/>
    <text x="125" y="240" text-anchor="middle" class="mono" style="font-size:16px;font-weight:800;fill:#1E3A8A">jsmith/</text>
    <!-- padlock -->
    <g transform="translate(196,190)">
      <path d="M-10,-4 V-12 A10,10 0 0 1 10,-12 V-4" fill="none" stroke="#1E293B" stroke-width="3"/>
      <rect class="ink" x="-15" y="-4" width="30" height="24" rx="5" fill="#FFC53A" stroke-width="2.5"/>
      <circle cx="0" cy="7" r="3" fill="#1E293B"/>
    </g>
  </g>

  <use href="#gmc-quiz-arrow" x="226" y="200"/>

  <!-- ===== 2. the quiz is built automatically ===== -->
  <ellipse cx="375" cy="272" rx="100" ry="8" fill="#86EFAC" opacity=".45"/>
  <g transform="translate(375,170)">
    <g fill="#94A3B8" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round">
      <rect x="-9" y="-62" width="18" height="20" rx="3"/>
      <rect x="-9" y="-62" width="18" height="20" rx="3" transform="rotate(45)"/>
      <rect x="-9" y="-62" width="18" height="20" rx="3" transform="rotate(90)"/>
      <rect x="-9" y="-62" width="18" height="20" rx="3" transform="rotate(135)"/>
      <rect x="-9" y="-62" width="18" height="20" rx="3" transform="rotate(180)"/>
      <rect x="-9" y="-62" width="18" height="20" rx="3" transform="rotate(225)"/>
      <rect x="-9" y="-62" width="18" height="20" rx="3" transform="rotate(270)"/>
      <rect x="-9" y="-62" width="18" height="20" rx="3" transform="rotate(315)"/>
    </g>
    <circle class="ink" r="47" fill="#94A3B8"/>
    <circle class="ink" r="32" fill="#FFF7ED"/>
    <use href="#gmc-quiz-run" y="-2"/>
  </g>
  <!-- a question with a missing wrong answer, set aside -->
  <g class="txt" transform="translate(448,104) rotate(14)">
    <rect class="ink" x="-20" y="-24" width="40" height="48" rx="6" fill="#FFFFFF" stroke-width="2.2"/>
    <circle cx="-9" cy="-10" r="3.2" fill="none" stroke="#94A3B8" stroke-width="2"/><circle cx="-9" cy="0" r="3.2" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="-9" cy="10" r="3.2" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="2 2"/>
    <path d="M-1,-10 H12 M-1,0 H10" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(466,86)">
    <circle r="11" fill="#DC2626" stroke="#1E293B" stroke-width="2.2"/>
    <path d="M-4,-4 L4,4 M4,-4 L-4,4" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"/>
  </g>
  <g class="txt">
    <rect class="ink" x="303" y="240" width="144" height="28" rx="8" fill="#16A34A" stroke-width="2.2"/>
    <text x="375" y="259" text-anchor="middle" font-size="12.5" font-weight="800" fill="#FFFFFF">Generate LMS Quiz</text>
  </g>

  <use href="#gmc-quiz-arrow" x="476" y="200"/>

  <!-- ===== 3. two quiz files ===== -->
  <ellipse cx="625" cy="272" rx="100" ry="8" fill="#FDBA74" opacity=".45"/>
  <g class="txt">
    <g transform="translate(585,178) rotate(-5)">
      <use href="#gmc-quiz-page"/>
      <rect class="ink" x="-40" y="16" width="64" height="22" rx="6" fill="#EA580C" stroke-width="2.2"/>
      <text x="-8" y="32" text-anchor="middle" class="mono" style="font-size:12px;font-weight:800;fill:#FFFFFF">.imscc</text>
    </g>
    <g transform="translate(668,190) rotate(5)">
      <use href="#gmc-quiz-page"/>
      <rect class="ink" x="-40" y="16" width="54" height="22" rx="6" fill="#2563EB" stroke-width="2.2"/>
      <text x="-13" y="32" text-anchor="middle" class="mono" style="font-size:12px;font-weight:800;fill:#FFFFFF">.csv</text>
    </g>
    <text x="578" y="258" text-anchor="middle" font-size="12" font-weight="800" fill="#C2410C">any LMS</text>
    <text x="672" y="266" text-anchor="middle" font-size="12" font-weight="800" fill="#1D4ED8">Brightspace only</text>
  </g>

  <use href="#gmc-quiz-arrow" x="726" y="200"/>

  <!-- ===== 4. you import it into your LMS ===== -->
  <ellipse cx="875" cy="272" rx="100" ry="8" fill="#FDBA74" opacity=".45"/>
  <g class="txt">
    <rect class="ink" x="784" y="92" width="182" height="168" rx="12" fill="#FFFFFF"/>
    <path d="M784,116 H966" stroke="#1E293B" stroke-width="2.5"/>
    <circle cx="798" cy="104" r="4" fill="#F87171"/><circle cx="811" cy="104" r="4" fill="#FBBF24"/><circle cx="824" cy="104" r="4" fill="#34D399"/>
    <text x="800" y="142" font-size="13" font-weight="800" fill="#1E293B">Quiz · jsmith</text>
    <path d="M800,158 H948" stroke="#CBD5E1" stroke-width="3.5" stroke-linecap="round"/>
    <g stroke="#1E293B" stroke-width="2" fill="#FFFFFF">
      <circle cx="806" cy="178" r="6"/><circle cx="806" cy="198" r="6"/><circle cx="806" cy="218" r="6"/><circle cx="806" cy="238" r="6"/>
    </g>
    <circle cx="806" cy="198" r="3" fill="#16A34A"/>
    <path d="M820,178 H918 M820,198 H930 M820,218 H904 M820,238 H924" stroke="#CBD5E1" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- ===== captions ===== -->
  <g class="txt" text-anchor="middle">
    <text class="ttl" x="125" y="320">A student's</text>
    <text class="ttl" x="125" y="342">questions arrive</text>
    <text class="sub" x="125" y="366">in your private repository</text>

    <text class="ttl" x="375" y="320">The quiz is built</text>
    <text class="ttl" x="375" y="342">automatically</text>
    <text class="sub" x="375" y="366">a question without three</text>
    <text class="sub" x="375" y="386">wrong answers is left out</text>

    <text class="ttl" x="625" y="320">Two quiz files</text>
    <text class="ttl" x="625" y="342">appear</text>
    <text class="sub" x="625" y="366">within a few minutes</text>

    <text class="ttl" x="875" y="320">You import it</text>
    <text class="ttl" x="875" y="342">into your LMS</text>
    <text class="sub" x="875" y="366">as a ready-made quiz</text>
  </g>
</svg>
