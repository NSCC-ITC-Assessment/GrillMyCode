<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="gmc-range-title">
  <title id="gmc-range-title">How the base commit is chosen. A student repository's history runs from the empty tree, through the first commit (the template copy), a bot commit, the student's commits, a phase1 tag and more student commits, to the head: the commit the run is about. The run assesses everything after the base up to the head. With starter_code none, the base is the empty tree, so everything is assessed. With starter_code ignore, the default, or context or ask, the base is the first commit. skip_committers, github-actions[bot] by default, moves the base past a leading run of verified bot commits. On a tag run, tag_diff_base previous-tag or tag:phase1 moves the base to the earlier tag, so only the work since it is assessed. base_sha and head_sha override all of these.</title>
  <style>
    .txt{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .ttl{font-size:16px;font-weight:800;fill:#1E293B}
    .sub{font-size:13px;font-weight:600;fill:#475569}
    .node{font-size:12px;font-weight:700;fill:#475569}
    .bar{font-size:13px;font-weight:800;fill:#FFFFFF}
    .ink{stroke:#1E293B;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
    .guide{stroke:#FCD9B6;stroke-width:2.5;stroke-dasharray:3 7;stroke-linecap:round}
  </style>
  <defs>
    <path id="gmc-range-sparkle" d="M0,-10 C1,-3 3,-1 10,0 C3,1 1,3 0,10 C-1,3 -3,1 -10,0 C-3,-1 -1,-3 0,-10 Z"/>
    <circle id="gmc-range-commit" r="9" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5"/>
    <!-- the base: a hollow ring at the start of each bar -->
    <g id="gmc-range-base">
      <circle r="10" fill="#FFF7ED" stroke="#1E293B" stroke-width="2.5"/>
      <circle r="4" fill="#1E293B"/>
    </g>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1000" height="560" rx="32" fill="#FFF7ED"/>
  <g fill="#FFC53A">
    <use href="#gmc-range-sparkle" transform="translate(966,36) scale(.6)"/>
  </g>

  <!-- guides down from each possible base and the head -->
  <g class="guide">
    <line x1="80" y1="150" x2="80" y2="494"/>
    <line x1="190" y1="150" x2="190" y2="494"/>
    <line x1="290" y1="150" x2="290" y2="494"/>
    <line x1="580" y1="150" x2="580" y2="494"/>
    <line x1="900" y1="150" x2="900" y2="494" stroke="#FDBA74"/>
  </g>

  <!-- ===== the history ===== -->
  <text class="txt ttl" x="40" y="44">The student repository's history</text>
  <path d="M80,100 H940" fill="none" stroke="#FCD9B6" stroke-width="22" stroke-linecap="round"/>
  <path class="ink" fill="none" d="M934,90 L948,100 L934,110" stroke="#C2410C"/>

  <g class="txt">
    <!-- empty tree -->
    <circle cx="80" cy="100" r="11" fill="#FFF7ED" stroke="#64748B" stroke-width="2.5" stroke-dasharray="4 3"/>
    <text class="node" x="80" y="136" text-anchor="middle">empty tree</text>
    <!-- first commit -->
    <circle class="ink" cx="190" cy="100" r="12" fill="#64748B" stroke-width="2.5"/>
    <text class="node" x="190" y="136" text-anchor="middle">first commit</text>
    <text class="node" x="190" y="151" text-anchor="middle" style="font-weight:600">template copy</text>
    <!-- bot commit -->
    <rect class="ink" x="279" y="89" width="22" height="22" rx="5" fill="#CBD5E1" stroke-width="2.5"/>
    <circle cx="286" cy="99" r="2" fill="#1E293B"/><circle cx="294" cy="99" r="2" fill="#1E293B"/>
    <path d="M286,105 H294" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
    <text class="node" x="290" y="136" text-anchor="middle">bot commit</text>
    <!-- student commits -->
    <use href="#gmc-range-commit" x="370" y="100"/>
    <use href="#gmc-range-commit" x="440" y="100"/>
    <use href="#gmc-range-commit" x="510" y="100"/>
    <text class="node" x="440" y="136" text-anchor="middle">the student's commits</text>
    <!-- phase1 tag -->
    <circle class="ink" cx="580" cy="100" r="11" fill="#0D9488" stroke-width="2.5"/>
    <line class="ink" x1="580" y1="88" x2="580" y2="70" stroke-width="2.5"/>
    <path class="ink" fill="#0D9488" stroke-width="2.5" d="M580,42 H640 A5,5 0 0 1 645,47 V65 A5,5 0 0 1 640,70 H580 L570,56 Z"/>
    <circle cx="582" cy="56" r="3" fill="#FFF7ED"/>
    <text class="bar" x="614" y="61" text-anchor="middle" style="font-size:12px">phase1</text>
    <text class="node" x="580" y="136" text-anchor="middle">earlier tag</text>
    <use href="#gmc-range-commit" x="660" y="100"/>
    <use href="#gmc-range-commit" x="740" y="100"/>
    <use href="#gmc-range-commit" x="820" y="100"/>
    <!-- head -->
    <circle class="ink" cx="900" cy="100" r="14" fill="#EA580C"/>
    <text x="900" y="72" text-anchor="middle" font-size="14" font-weight="800" style="fill:#C2410C">head</text>
    <text class="node" x="900" y="136" text-anchor="middle">the commit the</text>
    <text class="node" x="900" y="151" text-anchor="middle">run is about</text>
  </g>

  <!-- ===== the bases ===== -->
  <!-- row 1: starter_code none -->
  <rect x="20" y="170" width="960" height="76" rx="20" fill="#FFFFFF" fill-opacity=".7"/>
  <g class="txt">
    <text class="sub" x="100" y="194"><tspan class="mono" style="font-weight:700;fill:#1E293B">starter_code: none</tspan> · base is the empty tree, so every commit is assessed</text>
    <rect class="ink" x="80" y="208" width="820" height="26" rx="13" fill="#475569" stroke-width="2.5"/>
    <text class="bar" x="110" y="226">assessed</text>
  </g>
  <use href="#gmc-range-base" x="80" y="221"/>

  <!-- row 2: the default -->
  <rect x="20" y="254" width="960" height="76" rx="20" fill="#FFFFFF" fill-opacity=".7"/>
  <g class="txt">
    <text class="sub" x="210" y="278"><tspan class="mono" style="font-weight:700;fill:#1E293B">starter_code: ignore</tspan> (default), <tspan class="mono" style="font-weight:700;fill:#1E293B">context</tspan> or <tspan class="mono" style="font-weight:700;fill:#1E293B">ask</tspan> · base is the first commit</text>
    <rect class="ink" x="190" y="292" width="710" height="26" rx="13" fill="#C2410C" stroke-width="2.5"/>
    <text class="bar" x="220" y="310">assessed</text>
  </g>
  <use href="#gmc-range-base" x="190" y="305"/>

  <!-- row 3: skip_committers -->
  <rect x="20" y="338" width="960" height="76" rx="20" fill="#FFFFFF" fill-opacity=".7"/>
  <g class="txt">
    <text class="sub" x="310" y="362"><tspan class="mono" style="font-weight:700;fill:#1E293B">skip_committers</tspan> · base moves past a leading run of verified bot commits</text>
    <rect class="ink" x="290" y="376" width="610" height="26" rx="13" fill="#7C3AED" stroke-width="2.5"/>
    <text class="bar" x="320" y="394">assessed</text>
  </g>
  <use href="#gmc-range-base" x="290" y="389"/>

  <!-- row 4: tag_diff_base -->
  <rect x="20" y="422" width="960" height="76" rx="20" fill="#FFFFFF" fill-opacity=".7"/>
  <g class="txt">
    <text class="sub" x="44" y="446">tag runs only:</text>
    <text class="sub" x="44" y="464">base moves to</text>
    <text class="sub" x="44" y="482">the earlier tag</text>
    <text class="sub" x="600" y="446"><tspan class="mono" style="font-weight:700;fill:#1E293B">tag_diff_base: previous-tag</tspan> or <tspan class="mono" style="font-weight:700;fill:#1E293B">tag:phase1</tspan></text>
    <rect class="ink" x="580" y="460" width="320" height="26" rx="13" fill="#0D9488" stroke-width="2.5"/>
    <text class="bar" x="610" y="478">assessed</text>
  </g>
  <use href="#gmc-range-base" x="580" y="473"/>

  <!-- footnote -->
  <g class="txt" text-anchor="middle">
    <text class="sub" x="500" y="526" style="font-size:14px"><tspan class="mono" style="font-weight:700;fill:#1E293B">base_sha</tspan> and <tspan class="mono" style="font-weight:700;fill:#1E293B">head_sha</tspan> override all of these.</text>
  </g>
</svg>
