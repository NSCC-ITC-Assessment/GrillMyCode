<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 -20 300 330" role="img" aria-label="The GrillMyCode flame wearing a wizard hat, with a magic wand">
  <defs>
    <linearGradient id="gmc-wiz-flame" x1="205" y1="60" x2="120" y2="295" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FA7A18"/>
      <stop offset="0.45" stop-color="#F13B1F"/>
      <stop offset="1" stop-color="#C8142E"/>
    </linearGradient>
    <linearGradient id="gmc-wiz-core" x1="0" y1="140" x2="0" y2="298" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC53A"/>
      <stop offset="1" stop-color="#FB8420"/>
    </linearGradient>
    <linearGradient id="gmc-wiz-hat" x1="150" y1="0" x2="240" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6D5BE8"/>
      <stop offset="1" stop-color="#3B2A9E"/>
    </linearGradient>
    <mask id="gmc-wiz-hole" maskUnits="userSpaceOnUse" x="60" y="-20" width="300" height="330">
      <rect x="60" y="-20" width="300" height="330" fill="#fff"/>
      <path d="M171 230C160 246 154 262 154 280V312H204V296C202 272 190 248 171 230Z" fill="#000"/>
    </mask>
  </defs>

  <!-- Flame (from the GrillMyCode logo) -->
  <g mask="url(#gmc-wiz-hole)">
    <path fill="url(#gmc-wiz-flame)" d="M184 54C206 80 222 112 214 150C211 164 210 176 214 188C224 180 234 170 237 158C252 180 259 200 258 226C257 268 224 298 180 299C136 299 101 268 101 226C101 186 124 158 152 132C170 114 180 90 184 54Z"/>
    <path fill="url(#gmc-wiz-core)" d="M188 138C186 170 184 196 192 214C214 228 223 248 221 266C219 284 210 294 204 298H156C142 290 129 272 129 250C129 212 170 176 188 138Z"/>
  </g>

  <!-- Wizard hat, tilted slightly -->
  <g transform="rotate(-8 190 110)">
    <path fill="url(#gmc-wiz-hat)" d="M146 108C160 80 172 44 186 18C194 4 206 -6 226 -4C214 2 208 12 206 26C206 52 214 80 232 108Z"/>
    <path fill="#FFC53A" d="M152 96C176 92 206 92 228 96L232 108C206 104 176 104 148 108Z"/>
    <ellipse cx="190" cy="110" rx="66" ry="13" fill="#4332B0"/>
    <!-- Stars on the hat -->
    <path fill="#FFC53A" d="M186 54l3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/>
    <circle cx="203" cy="38" r="3" fill="#FFE08A"/>
    <circle cx="172" cy="78" r="2.5" fill="#FFE08A"/>
    <circle cx="210" cy="74" r="2.5" fill="#FFE08A"/>
  </g>

  <!-- Wand -->
  <g transform="translate(-16 4) rotate(35 300 230)">
    <rect x="294" y="170" width="12" height="118" rx="6" fill="#8A5A34" stroke="#5C3A1E" stroke-width="3"/>
    <rect x="294" y="170" width="12" height="20" rx="6" fill="#F8FAFC"/>
  </g>

  <!-- Sparkles from the wand tip -->
  <path fill="#FFC53A" d="M328 150l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/>
  <path fill="#FFE08A" d="M300 128l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/>
  <path fill="#FFE08A" d="M342 204l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/>
</svg>
