<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="The GrillMyCode flame generates an AI spark that branches into a GitHub issue and a downloadable PDF">
  <style>
    .cardBg{fill:#F8FAFC;stroke:#0F172A;stroke-opacity:.08;stroke-width:2;}
  </style>
  <defs>
    <linearGradient id="gmc-delivery-braces" x1="0" y1="78" x2="0" y2="318" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FD840D"/><stop offset="0.5" stop-color="#F54719"/><stop offset="1" stop-color="#C4142C"/>
    </linearGradient>
    <linearGradient id="gmc-delivery-flame" x1="205" y1="60" x2="120" y2="295" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FA7A18"/><stop offset="0.45" stop-color="#F13B1F"/><stop offset="1" stop-color="#C8142E"/>
    </linearGradient>
    <linearGradient id="gmc-delivery-core" x1="0" y1="140" x2="0" y2="298" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC53A"/><stop offset="1" stop-color="#FB8420"/>
    </linearGradient>
    <mask id="gmc-delivery-hole" maskUnits="userSpaceOnUse" x="6" y="11" width="350" height="350">
      <rect x="6" y="11" width="350" height="350" fill="#fff"/>
      <path d="M171 230C160 246 154 262 154 280V312H204V296C202 272 190 248 171 230Z" fill="#000"/>
    </mask>
  </defs>
  <g transform="translate(14,76) scale(0.5)">
    <g fill="none" stroke="url(#gmc-delivery-braces)" stroke-width="27">
      <path d="M118 91H96Q66 91 66 121V162Q66 196 20 196Q66 196 66 230V271Q66 301 96 301H118"/>
      <path d="M244 91H266Q296 91 296 121V162Q296 196 342 196Q296 196 296 230V271Q296 301 266 301H244"/>
    </g>
    <g mask="url(#gmc-delivery-hole)">
      <path fill="url(#gmc-delivery-flame)" d="M184 54C206 80 222 112 214 150C211 164 210 176 214 188C224 180 234 170 237 158C252 180 259 200 258 226C257 268 224 298 180 299C136 299 101 268 101 226C101 186 124 158 152 132C170 114 180 90 184 54Z"/>
      <path fill="url(#gmc-delivery-core)" d="M188 138C186 170 184 196 192 214C214 228 223 248 221 266C219 284 210 294 204 298H156C142 290 129 272 129 250C129 212 170 176 188 138Z"/>
    </g>
  </g>

  <circle cx="340" cy="150" r="150" fill="#F97316" opacity=".07"/>

  <!-- connector lines from the spark to each output -->
  <path d="M242,70 C280,80 292,90 308,100" fill="none" stroke="#94A3B8" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <path d="M234,86 C270,140 290,175 308,206" fill="none" stroke="#94A3B8" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>

  <!-- AI spark -->
  <g transform="translate(226,46)">
    <path d="M10,0 C11,7 13,9 20,10 C13,11 11,13 10,20 C9,13 7,11 0,10 C7,9 9,7 10,0 Z" fill="#FFC53A"/>
    <circle cx="26" cy="22" r="2.4" fill="#FFC53A"/>
    <circle cx="-4" cy="20" r="1.6" fill="#FFC53A"/>
  </g>

  <!-- GitHub issue card -->
  <g>
    <rect x="300" y="58" width="150" height="78" rx="14" class="cardBg"/>
    <circle cx="328" cy="84" r="13" fill="#C2410C"/>
    <path d="M328,77 v10 M328,90.5 v.5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <rect x="352" y="76" width="82" height="7" rx="3.5" fill="#475569"/>
    <rect x="352" y="90" width="60" height="7" rx="3.5" fill="#475569" opacity=".55"/>
    <rect x="316" y="108" width="42" height="14" rx="7" fill="#FFC53A"/>
    <text x="337" y="118" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#0F172A" text-anchor="middle">ISSUE</text>
  </g>

  <!-- PDF card -->
  <g>
    <rect x="300" y="164" width="150" height="78" rx="14" class="cardBg"/>
    <path d="M322,180 h20 l8,8 v24 h-28 Z" fill="#475569"/>
    <path d="M342,180 v8 h8 Z" fill="#1E293B"/>
    <path d="M328,215 v-8 l6,6 l6,-6 v8" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="368" y="188" width="66" height="7" rx="3.5" fill="#475569"/>
    <rect x="368" y="202" width="46" height="7" rx="3.5" fill="#475569" opacity=".55"/>
    <rect x="316" y="214" width="34" height="14" rx="7" fill="#FFC53A"/>
    <text x="333" y="224" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#0F172A" text-anchor="middle">PDF</text>
  </g>
</svg>
