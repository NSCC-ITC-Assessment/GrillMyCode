<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="gmc-naming-title">
  <title id="gmc-naming-title">How the assignment and student are read from a Classroom 50 repository name. The repository cs-principles-lab-3-jsmith has a direct collaborator, jsmith, whose login ends the name. Everything before it, cs-principles-lab-3, plus -grillmycode-instructor names the instructor repository, cs-principles-lab-3-grillmycode-instructor. The login names the student's folder, jsmith/. A team repository ending in -group-2 is filed under group-2/. Anything else gets no answer key: a workflow warning, and the issue and PDF as normal. Who pushed, who started the run, commit authors and the template are never used.</title>
  <style>
    .txt{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .ttl{font-size:16px;font-weight:800;fill:#1E293B}
    .sub{font-size:13px;font-weight:600;fill:#475569}
    .code{font-size:14px;font-weight:700;fill:#1E293B}
    .ink{stroke:#1E293B;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
  </style>
  <defs>
    <path id="gmc-naming-sparkle" d="M0,-10 C1,-3 3,-1 10,0 C3,1 1,3 0,10 C-1,3 -3,1 -10,0 C-3,-1 -1,-3 0,-10 Z"/>
    <path id="gmc-naming-down" d="M0,0 V30 M-7,23 L0,30 L7,23" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="gmc-naming-folder">
      <path class="ink" fill="#FDBA74" stroke-width="2.2" d="M0,0 H18 L23,5 H40 V26 H0 Z"/>
    </g>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1000" height="450" rx="32" fill="#FFF7ED"/>
  <g fill="#FFC53A">
    <use href="#gmc-naming-sparkle" transform="translate(966,36) scale(.6)"/>
  </g>

  <text class="txt ttl" x="40" y="44">The student repository</text>

  <!-- ===== the repository name, split ===== -->
  <g class="txt">
    <rect class="ink" x="40" y="62" width="336" height="48" rx="12" fill="#DBEAFE" stroke-width="2.5"/>
    <text class="mono" x="208" y="94" text-anchor="middle" style="font-size:22px;font-weight:800;fill:#1E3A8A">cs-principles-lab-3</text>
    <rect class="ink" x="380" y="62" width="128" height="48" rx="12" fill="#FFEDD5" stroke-width="2.5"/>
    <text class="mono" x="444" y="94" text-anchor="middle" style="font-size:22px;font-weight:800;fill:#9A3412">-jsmith</text>
    <text class="sub" x="208" y="132" text-anchor="middle">&lt;classroom&gt;-&lt;assignment&gt;</text>
    <text class="sub" x="444" y="132" text-anchor="middle">-&lt;login&gt;</text>
  </g>

  <!-- the matching direct collaborator -->
  <g class="txt">
    <path d="M512,86 H616" fill="none" stroke="#EA580C" stroke-width="2.5" stroke-dasharray="4 6" stroke-linecap="round"/>
    <text class="sub" x="564" y="76" text-anchor="middle" style="font-size:12px;fill:#C2410C">matches</text>
    <rect class="ink" x="620" y="62" width="300" height="48" rx="24" fill="#FFFFFF" stroke-width="2.5"/>
    <circle cx="646" cy="86" r="14" fill="#FDDCB5" stroke="#1E293B" stroke-width="2"/>
    <path d="M636,80 Q646,68 656,80 Q650,76 640,79 Z" fill="#5B3A29"/>
    <circle cx="641.5" cy="87" r="1.6" fill="#1E293B"/><circle cx="650.5" cy="87" r="1.6" fill="#1E293B"/>
    <text class="code" x="670" y="84">jsmith</text>
    <text class="sub" x="670" y="101" style="font-size:12px">the one direct collaborator</text>
  </g>

  <!-- ===== what it produces ===== -->
  <use href="#gmc-naming-down" x="208" y="142"/>
  <use href="#gmc-naming-down" x="444" y="142"/>
  <g class="txt">
    <rect class="ink" x="40" y="182" width="420" height="72" rx="14" fill="#FFFFFF" stroke-width="2.5"/>
    <text class="sub" x="58" y="206">Instructor repository: that, plus a suffix</text>
    <text class="mono code" x="58" y="234"><tspan fill="#1E3A8A">cs-principles-lab-3</tspan><tspan fill="#64748B">-grillmycode-instructor</tspan></text>
    <rect class="ink" x="472" y="182" width="170" height="72" rx="14" fill="#FFFFFF" stroke-width="2.5"/>
    <text class="sub" x="490" y="206">Student folder</text>
    <use href="#gmc-naming-folder" x="490" y="216"/>
    <text class="mono code" x="540" y="236" style="fill:#9A3412">jsmith/</text>
  </g>

  <!-- ===== other cases ===== -->
  <g class="txt">
    <rect x="40" y="282" width="440" height="116" rx="18" fill="#FFFFFF" fill-opacity=".8"/>
    <rect x="58" y="298" width="136" height="24" rx="12" fill="#0D9488"/>
    <text x="126" y="315" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">Team repository</text>
    <text class="mono code" x="58" y="352"><tspan fill="#1E3A8A">cs-principles-lab-3</tspan><tspan fill="#0F766E">-group-2</tspan></text>
    <text class="sub" x="58" y="380">filed under</text>
    <use href="#gmc-naming-folder" x="150" y="360"/>
    <text class="mono code" x="200" y="380" style="fill:#0F766E">group-2/</text>

    <rect x="500" y="282" width="460" height="116" rx="18" fill="#FFFFFF" fill-opacity=".8"/>
    <rect x="518" y="298" width="124" height="24" rx="12" fill="#64748B"/>
    <text x="580" y="315" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">Anything else</text>
    <text class="sub" x="518" y="346">No match, or more than one: no answer key.</text>
    <text class="sub" x="518" y="366">A workflow warning, and the issue and PDF as normal.</text>
  </g>

  <!-- footnote -->
  <text class="txt sub" x="500" y="430" text-anchor="middle" style="font-size:14px">Never used: who pushed, who started the run, commit authors, or the template.</text>
</svg>
