<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="The GrillMyCode flame sets one secret key that connects to several repositories">
  <style>
    .cardBg{fill:#F8FAFC;stroke:#0F172A;stroke-opacity:.08;stroke-width:2;}
  </style>
  <defs>
    <linearGradient id="gmc-setup-braces" x1="0" y1="78" x2="0" y2="318" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FD840D"/><stop offset="0.5" stop-color="#F54719"/><stop offset="1" stop-color="#C4142C"/>
    </linearGradient>
    <linearGradient id="gmc-setup-flame" x1="205" y1="60" x2="120" y2="295" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FA7A18"/><stop offset="0.45" stop-color="#F13B1F"/><stop offset="1" stop-color="#C8142E"/>
    </linearGradient>
    <linearGradient id="gmc-setup-core" x1="0" y1="140" x2="0" y2="298" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC53A"/><stop offset="1" stop-color="#FB8420"/>
    </linearGradient>
    <mask id="gmc-setup-hole" maskUnits="userSpaceOnUse" x="6" y="11" width="350" height="350">
      <rect x="6" y="11" width="350" height="350" fill="#fff"/>
      <path d="M171 230C160 246 154 262 154 280V312H204V296C202 272 190 248 171 230Z" fill="#000"/>
    </mask>
  </defs>
  <g transform="translate(14,70) scale(0.5)">
    <g fill="none" stroke="url(#gmc-setup-braces)" stroke-width="27">
      <path d="M118 91H96Q66 91 66 121V162Q66 196 20 196Q66 196 66 230V271Q66 301 96 301H118"/>
      <path d="M244 91H266Q296 91 296 121V162Q296 196 342 196Q296 196 296 230V271Q296 301 266 301H244"/>
    </g>
    <g mask="url(#gmc-setup-hole)">
      <path fill="url(#gmc-setup-flame)" d="M184 54C206 80 222 112 214 150C211 164 210 176 214 188C224 180 234 170 237 158C252 180 259 200 258 226C257 268 224 298 180 299C136 299 101 268 101 226C101 186 124 158 152 132C170 114 180 90 184 54Z"/>
      <path fill="url(#gmc-setup-core)" d="M188 138C186 170 184 196 192 214C214 228 223 248 221 266C219 284 210 294 204 298H156C142 290 129 272 129 250C129 212 170 176 188 138Z"/>
    </g>
  </g>

  <!-- soft glow behind key panel -->
  <circle cx="330" cy="145" r="110" fill="#F97316" opacity=".08"/>

  <!-- connecting lines from key panel to repo chips -->
  <path d="M368,95 C400,80 415,70 430,58" fill="none" stroke="#94A3B8" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <path d="M372,145 C400,145 412,145 430,145" fill="none" stroke="#94A3B8" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <path d="M368,195 C400,210 415,220 430,232" fill="none" stroke="#94A3B8" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>

  <!-- repo chips -->
  <g>
    <rect x="430" y="42" width="34" height="32" rx="8" class="cardBg"/>
    <path d="M438,54 h18 M438,60 h18 M438,66 h11" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="430" y="129" width="34" height="32" rx="8" class="cardBg"/>
    <path d="M438,141 h18 M438,147 h18 M438,153 h11" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="430" y="216" width="34" height="32" rx="8" class="cardBg"/>
    <path d="M438,228 h18 M438,234 h18 M438,240 h11" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- key / secret panel -->
  <g>
    <rect x="255" y="90" width="115" height="110" rx="16" class="cardBg"/>
    <circle cx="312" cy="128" r="16" fill="none" stroke="#334155" stroke-width="6"/>
    <rect x="308" y="140" width="8" height="22" rx="3" fill="#334155"/>
    <rect x="277" y="172" width="70" height="12" rx="6" fill="#FFC53A"/>
    <rect x="277" y="172" width="26" height="12" rx="6" fill="#C2410C"/>
  </g>
</svg>
