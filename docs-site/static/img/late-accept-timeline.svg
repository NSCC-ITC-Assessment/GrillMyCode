<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="gmc-late-title">
  <title id="gmc-late-title">Each student's repository is a copy of your template as it was when they accepted. On a timeline, you add GrillMyCode to the template partway through. A student who accepted before that doesn't have it, and gets it the next time they run gh student submit. Another student who accepted before gets it when you add the file to their repository yourself. A student who accepts after has it from the start.</title>
  <style>
    .txt{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .ttl{font-size:18px;font-weight:800;fill:#1E293B}
    .sub{font-size:14px;font-weight:600;fill:#475569}
    .ink{stroke:#1E293B;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
    .guide{stroke:#FCD9B6;stroke-width:2.5;stroke-dasharray:3 7;stroke-linecap:round}
    .wait{stroke:#CBD5E1;stroke-width:3;stroke-dasharray:2 9;stroke-linecap:round;fill:none}
  </style>
  <defs>
    <linearGradient id="gmc-late-flame" x1="205" y1="60" x2="120" y2="295" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FA7A18"/><stop offset="0.45" stop-color="#F13B1F"/><stop offset="1" stop-color="#C8142E"/>
    </linearGradient>
    <linearGradient id="gmc-late-core" x1="0" y1="140" x2="0" y2="298" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC53A"/><stop offset="1" stop-color="#FB8420"/>
    </linearGradient>
    <path id="gmc-late-sparkle" d="M0,-10 C1,-3 3,-1 10,0 C3,1 1,3 0,10 C-1,3 -3,1 -10,0 C-3,-1 -1,-3 0,-10 Z"/>
    <!-- a small flame, centred on 0,0 -->
    <g id="gmc-late-mini">
      <g transform="scale(.11) translate(-180,-190)">
        <path fill="url(#gmc-late-flame)" d="M184 54C206 80 222 112 214 150C211 164 210 176 214 188C224 180 234 170 237 158C252 180 259 200 258 226C257 268 224 298 180 299C136 299 101 268 101 226C101 186 124 158 152 132C170 114 180 90 184 54Z"/>
        <path fill="url(#gmc-late-core)" d="M188 138C186 170 184 196 192 214C214 228 223 248 221 266C219 284 210 294 204 298H156C142 290 129 272 129 250C129 212 170 176 188 138Z"/>
      </g>
    </g>
    <!-- the workflow file: a page with the flame on it -->
    <g id="gmc-late-file">
      <rect class="ink" x="-22" y="-28" width="44" height="56" rx="6" fill="#FFFFFF" stroke-width="2.5"/>
      <use href="#gmc-late-mini" y="-4"/>
      <path d="M-12,16 H12" stroke="#CBD5E1" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <!-- a student repository, centred on 0,0: without, then with, the workflow -->
    <g id="gmc-late-repo">
      <rect class="ink" x="-30" y="-30" width="60" height="60" rx="10" fill="#FFFFFF" stroke-width="2.5"/>
      <path d="M-30,-15 H30" stroke="#1E293B" stroke-width="2.5"/>
      <circle cx="-21" cy="-22.5" r="2.6" fill="#F87171"/><circle cx="-13" cy="-22.5" r="2.6" fill="#FBBF24"/><circle cx="-5" cy="-22.5" r="2.6" fill="#34D399"/>
      <path d="M-20,-3 H8 M-20,7 H14 M-20,17 H2" stroke="#CBD5E1" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <g id="gmc-late-repo-gmc">
      <use href="#gmc-late-repo"/>
      <g transform="translate(20,18) scale(.62)"><use href="#gmc-late-file"/></g>
    </g>
    <g id="gmc-late-yes">
      <circle r="11" fill="#16A34A" stroke="#1E293B" stroke-width="2.5"/>
      <path d="M-5,0.5 L-1.4,4.2 L5.2,-3.6" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path id="gmc-late-arrow" class="ink" fill="#FDBA74" stroke-width="2.2" d="M0,-6 H16 V-13 L30,0 L16,13 V6 H0 Z"/>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1000" height="580" rx="32" fill="#FFF7ED"/>
  <g fill="#FFC53A">
    <use href="#gmc-late-sparkle" transform="translate(395,44) scale(.7)"/>
    <use href="#gmc-late-sparkle" transform="translate(966,196) scale(.6)"/>
  </g>

  <!-- ===== the template ===== -->
  <g class="txt">
    <rect class="ink" x="36" y="58" width="120" height="84" rx="14" fill="#FFFFFF"/>
    <rect x="43" y="65" width="106" height="70" rx="9" fill="none" stroke="#F97316" stroke-width="2.5" stroke-dasharray="6 5"/>
    <path d="M36,82 H156" stroke="#1E293B" stroke-width="3"/>
    <circle cx="51" cy="70" r="4" fill="#F87171"/><circle cx="64" cy="70" r="4" fill="#FBBF24"/><circle cx="77" cy="70" r="4" fill="#34D399"/>
    <text x="96" y="108" text-anchor="middle" font-size="14" font-weight="800" fill="#334155">starter</text>
    <text x="96" y="125" text-anchor="middle" font-size="14" font-weight="800" fill="#334155">template</text>
    <text class="ttl" x="176" y="86">Each student gets a copy</text>
    <text class="ttl" x="176" y="108">of your template</text>
    <text class="sub" x="176" y="130">as it was when they accepted</text>
  </g>

  <!-- guides down the lanes -->
  <line class="guide" x1="600" y1="168" x2="600" y2="556" stroke="#FB923C" stroke-dasharray="6 7"/>

  <!-- timeline road -->
  <path d="M430,150 H960" fill="none" stroke="#FCD9B6" stroke-width="22" stroke-linecap="round"/>
  <path d="M430,150 H960" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="10 12" stroke-linecap="round"/>
  <path class="ink" fill="none" d="M946,140 L960,150 L946,160" stroke="#C2410C"/>
  <g class="txt sub" text-anchor="middle">
    <text x="515" y="186">before</text>
    <text x="685" y="186">after</text>
    <text x="958" y="186" text-anchor="end">time</text>
  </g>

  <!-- you add GrillMyCode -->
  <circle class="ink" cx="600" cy="150" r="13" fill="#F97316"/>
  <g transform="translate(600,82) rotate(6)"><use href="#gmc-late-file"/></g>
  <path d="M600,116 V130" stroke="#94A3B8" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/>
  <g class="txt">
    <text class="ttl" x="636" y="78" style="fill:#C2410C;fill:#C2410C">You add GrillMyCode</text>
    <text class="sub" x="636" y="100">to the template</text>
  </g>

  <!-- ===== lane 1: accepted before, gets it on submit ===== -->
  <rect x="20" y="206" width="960" height="110" rx="22" fill="#FFFFFF" fill-opacity=".75"/>
  <g stroke="#1E293B" stroke-width="2.2" stroke-linejoin="round" transform="translate(60,250) scale(1.25)">
    <path fill="#5B3A29" d="M-13,-2 C-14,-14 -7,-17 0,-17 C7,-17 14,-14 13,-2 C13,8 14,14 17,19 H-17 C-14,14 -13,8 -13,-2 Z"/>
    <path fill="#F97316" d="M-21,32 C-21,21 -12,16 0,16 C12,16 21,21 21,32 Z"/><path fill="#FDDCB5" d="M-4.5,8 V17 Q0,21 4.5,17 V8 Z"/><ellipse cx="0" cy="0" rx="11" ry="13" fill="#FDDCB5"/>
    <path fill="#5B3A29" d="M-11,-3 C-12,-13 -5,-16 1,-16 C8,-16 12,-11 11,-3 C6,-7 1,-10 -3,-13 C-5,-8 -8,-5 -11,-3 Z"/><g fill="#1E293B" stroke="none"><circle cx="-4.5" cy="1" r="1.6"/><circle cx="4.5" cy="1" r="1.6"/></g><path d="M-7,-3.5 Q-4.5,-5 -2,-4 M2,-4 Q4.5,-5 7,-3.5" fill="none" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round"/><path d="M0.4,2.5 Q-1,5 0.6,5.4" fill="none" stroke="#1E293B" stroke-width="1.2" stroke-linecap="round" stroke-opacity=".55"/><path d="M-3,8 Q0,9.6 3,8" fill="none" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <g class="txt">
    <text class="ttl" x="104" y="252">Accepted before</text>
    <text class="sub" x="104" y="274">gets it the next time they run</text>
    <text class="sub" x="104" y="294"><tspan class="mono" style="font-weight:700;fill:#1E293B">gh student submit</tspan></text>
  </g>
  <use href="#gmc-late-repo" x="480" y="258"/>
  <text class="txt sub" x="480" y="306" text-anchor="middle" style="font-size:13px">accepts</text>
  <path class="wait" d="M520,258 H640"/>
  <g class="txt">
    <rect class="ink" x="648" y="241" width="188" height="34" rx="8" fill="#1E293B" stroke-width="2.5"/>
    <text class="mono" x="742" y="263" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#FFFFFF"><tspan fill="#FDBA74">$</tspan> gh student submit</text>
  </g>
  <use href="#gmc-late-arrow" x="846" y="258"/>
  <use href="#gmc-late-repo-gmc" x="916" y="258"/>
  <use href="#gmc-late-yes" x="944" y="230"/>

  <!-- ===== lane 2: accepted before, you add it ===== -->
  <rect x="20" y="332" width="960" height="110" rx="22" fill="#FFFFFF" fill-opacity=".75"/>
  <g stroke="#1E293B" stroke-width="2.2" stroke-linejoin="round" transform="translate(60,376) scale(1.25)">
    <path fill="#334155" d="M-21,32 C-21,21 -12,16 0,16 C12,16 21,21 21,32 Z"/><path fill="#C68642" d="M-4.5,8 V17 Q0,21 4.5,17 V8 Z"/><ellipse cx="0" cy="0" rx="11" ry="13" fill="#C68642"/>
    <path fill="#111827" d="M-11,-4 C-12,-13 -6,-16 1,-16 C8,-16 12,-12 11,-4 C9,-8 5,-10 0,-10 C-5,-10 -9,-8 -11,-4 Z"/><g fill="#1E293B" stroke="none"><circle cx="-4.5" cy="1" r="1.6"/><circle cx="4.5" cy="1" r="1.6"/></g><path d="M-7,-3.5 Q-4.5,-5 -2,-4 M2,-4 Q4.5,-5 7,-3.5" fill="none" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round"/><path d="M0.4,2.5 Q-1,5 0.6,5.4" fill="none" stroke="#1E293B" stroke-width="1.2" stroke-linecap="round" stroke-opacity=".55"/><path d="M-3,8 Q0,9.6 3,8" fill="none" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <g class="txt">
    <text class="ttl" x="104" y="378">Accepted before</text>
    <text class="sub" x="104" y="400">or gets it when you add the file</text>
    <text class="sub" x="104" y="420">to their repository yourself</text>
  </g>
  <use href="#gmc-late-repo" x="540" y="384"/>
  <text class="txt sub" x="540" y="432" text-anchor="middle" style="font-size:13px">accepts</text>
  <path class="wait" d="M580,384 H664"/>
  <!-- you, adding the file -->
  <g transform="translate(700,382) scale(.62) translate(-720,-500)">
    <path class="ink" fill="#334155" d="M676,548 C676,510 694,496 720,496 C746,496 764,510 764,548 Z"/>
    <path class="ink" fill="none" stroke="#FFFFFF" d="M708,498 L720,512 L732,498"/>
    <circle class="ink" cx="720" cy="464" r="27" fill="#E8B48A"/>
    <path class="ink" fill="#4B5563" d="M693,460 C688,438 702,428 718,430 C724,424 736,426 740,432 C750,438 750,450 747,460 C744,452 740,448 736,446 C730,452 718,454 706,450 C700,452 696,456 693,460 Z"/>
    <circle cx="710" cy="466" r="8" fill="#FFFFFF" fill-opacity=".6" class="ink" stroke-width="2.5"/>
    <circle cx="731" cy="466" r="8" fill="#FFFFFF" fill-opacity=".6" class="ink" stroke-width="2.5"/>
    <path d="M718,466 H723" stroke="#1E293B" stroke-width="2.5"/>
    <circle cx="710" cy="467" r="2.8" fill="#1E293B"/><circle cx="731" cy="467" r="2.8" fill="#1E293B"/>
    <path class="ink" fill="none" d="M712,481 Q720,488 728,481"/>
  </g>
  <g transform="translate(772,380) rotate(-8) scale(.9)"><use href="#gmc-late-file"/></g>
  <text class="txt sub" x="736" y="432" text-anchor="middle" style="font-size:13px">you add it</text>
  <use href="#gmc-late-arrow" x="846" y="384"/>
  <use href="#gmc-late-repo-gmc" x="916" y="384"/>
  <use href="#gmc-late-yes" x="944" y="356"/>

  <!-- ===== lane 3: accepted after ===== -->
  <rect x="20" y="458" width="960" height="110" rx="22" fill="#FFFFFF" fill-opacity=".75"/>
  <g stroke="#1E293B" stroke-width="2.2" stroke-linejoin="round" transform="translate(60,502) scale(1.25)">
    <path fill="#7C3AED" d="M-21,32 C-21,21 -12,16 0,16 C12,16 21,21 21,32 Z"/>
    <path fill="#0D9488" d="M-14,0 C-15,-14 -8,-18 0,-18 C8,-18 15,-14 14,0 C14,10 12,15 19,21 H-19 C-12,15 -14,10 -14,0 Z"/>
    <ellipse cx="0" cy="1" rx="9.5" ry="11.5" fill="#E8B48A"/><g fill="#1E293B" stroke="none"><circle cx="-4.5" cy="1" r="1.6"/><circle cx="4.5" cy="1" r="1.6"/></g><path d="M-7,-3.5 Q-4.5,-5 -2,-4 M2,-4 Q4.5,-5 7,-3.5" fill="none" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round"/><path d="M0.4,2.5 Q-1,5 0.6,5.4" fill="none" stroke="#1E293B" stroke-width="1.2" stroke-linecap="round" stroke-opacity=".55"/><path d="M-3,8 Q0,9.6 3,8" fill="none" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <g class="txt">
    <text class="ttl" x="104" y="504">Accepted after</text>
    <text class="sub" x="104" y="526">has it from the start</text>
  </g>
  <use href="#gmc-late-repo-gmc" x="700" y="510"/>
  <use href="#gmc-late-yes" x="728" y="482"/>
  <text class="txt sub" x="700" y="558" text-anchor="middle" style="font-size:13px">accepts</text>
</svg>
