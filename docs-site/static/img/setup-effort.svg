<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="gmc-setup-title">
  <title id="gmc-setup-title">How much setup GrillMyCode takes. Once per classroom: create and store your AI provider key in your GitHub organization. Once per assignment: add GrillMyCode to the starter template as one file, written by the Workflow Wizard. Automatic from then on: every student who accepts the assignment gets a copy.</title>
  <style>
    .txt{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .ttl{font-size:19px;font-weight:800;fill:#1E293B}
    .sub{font-size:14px;font-weight:600;fill:#475569}
    .tier{font-size:14px;font-weight:800;fill:#FFFFFF}
    .ink{stroke:#1E293B;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
  </style>
  <defs>
    <linearGradient id="gmc-setup-flame" x1="205" y1="60" x2="120" y2="295" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FA7A18"/><stop offset="0.45" stop-color="#F13B1F"/><stop offset="1" stop-color="#C8142E"/>
    </linearGradient>
    <linearGradient id="gmc-setup-core" x1="0" y1="140" x2="0" y2="298" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC53A"/><stop offset="1" stop-color="#FB8420"/>
    </linearGradient>
    <path id="gmc-setup-sparkle" d="M0,-10 C1,-3 3,-1 10,0 C3,1 1,3 0,10 C-1,3 -3,1 -10,0 C-3,-1 -1,-3 0,-10 Z"/>
    <!-- a small flame, centred on 0,0 -->
    <g id="gmc-setup-mini">
      <g transform="scale(.11) translate(-180,-190)">
        <path fill="url(#gmc-setup-flame)" d="M184 54C206 80 222 112 214 150C211 164 210 176 214 188C224 180 234 170 237 158C252 180 259 200 258 226C257 268 224 298 180 299C136 299 101 268 101 226C101 186 124 158 152 132C170 114 180 90 184 54Z"/>
        <path fill="url(#gmc-setup-core)" d="M188 138C186 170 184 196 192 214C214 228 223 248 221 266C219 284 210 294 204 298H156C142 290 129 272 129 250C129 212 170 176 188 138Z"/>
      </g>
    </g>
    <!-- the workflow file: a page with the flame on it -->
    <g id="gmc-setup-file">
      <rect class="ink" x="-22" y="-28" width="44" height="56" rx="6" fill="#FFFFFF" stroke-width="2.5"/>
      <use href="#gmc-setup-mini" y="-4"/>
      <path d="M-12,16 H12" stroke="#CBD5E1" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <!-- an empty student repository card -->
    <g id="gmc-setup-card">
      <rect class="ink" x="0" y="0" width="80" height="80" rx="12" fill="#FFFFFF" stroke-width="2.5"/>
      <path d="M0,20 H80" stroke="#1E293B" stroke-width="2.5"/>
      <circle cx="12" cy="10" r="3" fill="#F87171"/><circle cx="22" cy="10" r="3" fill="#FBBF24"/><circle cx="32" cy="10" r="3" fill="#34D399"/>
      <g transform="translate(64,60) scale(.5)"><use href="#gmc-setup-file"/></g>
    </g>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1000" height="480" rx="32" fill="#FFF7ED"/>
  <g fill="#FFC53A">
    <use href="#gmc-setup-sparkle" transform="translate(320,110) scale(.6)"/>
    <use href="#gmc-setup-sparkle" transform="translate(965,330) scale(.6)"/>
  </g>

  <!-- ===== tier labels ===== -->
  <g class="txt" text-anchor="middle">
    <rect class="ink" x="72" y="26" width="186" height="34" rx="17" fill="#334155" stroke-width="2.5"/>
    <text class="tier" x="165" y="48">Once per classroom</text>
    <rect class="ink" x="404" y="26" width="196" height="34" rx="17" fill="#C2410C" stroke-width="2.5"/>
    <text class="tier" x="502" y="48">Once per assignment</text>
    <rect class="ink" x="764" y="26" width="146" height="34" rx="17" fill="#16A34A" stroke-width="2.5"/>
    <text class="tier" x="837" y="48">Automatic</text>
  </g>

  <!-- ===== 1. once per classroom: the key goes in the safe ===== -->
  <ellipse cx="170" cy="332" rx="140" ry="9" fill="#FDBA74" opacity=".45"/>
  <!-- safe -->
  <g class="txt">
    <rect class="ink" x="176" y="150" width="132" height="178" rx="16" fill="#64748B"/>
    <rect class="ink" x="190" y="164" width="104" height="150" rx="10" fill="#94A3B8" stroke-width="2.5"/>
    <circle class="ink" cx="242" cy="222" r="24" fill="#E2E8F0" stroke-width="2.5"/>
    <circle cx="242" cy="222" r="6" fill="#334155"/>
    <path d="M242,202 V207 M242,237 V242 M222,222 H227 M257,222 H262" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <rect class="ink" x="278" y="206" width="8" height="34" rx="4" fill="#FFC53A" stroke-width="2"/>
    <rect class="ink" x="208" y="266" width="68" height="26" rx="6" fill="#FFFFFF" stroke-width="2"/>
    <text x="242" y="284" text-anchor="middle" font-size="11" font-weight="800" fill="#334155">your org</text>
    <rect x="188" y="326" width="18" height="8" rx="3" fill="#334155"/><rect x="278" y="326" width="18" height="8" rx="3" fill="#334155"/>
  </g>
  <!-- instructor holding up the key -->
  <g transform="translate(-620,-212)">
    <path class="ink" fill="#334155" d="M676,548 C676,510 694,496 720,496 C746,496 764,510 764,548 Z"/>
    <path class="ink" fill="none" stroke="#FFFFFF" d="M708,498 L720,512 L732,498"/>
    <circle class="ink" cx="720" cy="464" r="27" fill="#E8B48A"/>
    <path class="ink" fill="#4B5563" d="M693,460 C688,438 702,428 718,430 C724,424 736,426 740,432 C750,438 750,450 747,460 C744,452 740,448 736,446 C730,452 718,454 706,450 C700,452 696,456 693,460 Z"/>
    <circle cx="710" cy="466" r="8" fill="#FFFFFF" fill-opacity=".6" class="ink" stroke-width="2.5"/>
    <circle cx="731" cy="466" r="8" fill="#FFFFFF" fill-opacity=".6" class="ink" stroke-width="2.5"/>
    <path d="M718,466 H723" stroke="#1E293B" stroke-width="2.5"/>
    <circle cx="710" cy="467" r="2.8" fill="#1E293B"/><circle cx="731" cy="467" r="2.8" fill="#1E293B"/>
    <path class="ink" fill="none" d="M712,481 Q720,488 728,481"/>
    <path class="ink" fill="none" stroke-width="6" d="M752,516 C762,500 768,478 770,462"/>
  </g>
  <!-- the key -->
  <g transform="translate(152,240) rotate(-35)">
    <circle class="ink" cx="0" cy="0" r="13" fill="#FFC53A"/>
    <circle cx="0" cy="0" r="4.5" fill="#FFF7ED" class="ink" stroke-width="2"/>
    <path class="ink" fill="#FFC53A" d="M12,-4 H52 V4 H46 V12 H40 V4 H34 V10 H28 V4 H12 Z" stroke-width="2.5"/>
  </g>
  <g fill="#FFC53A">
    <use href="#gmc-setup-sparkle" transform="translate(140,196) scale(.55)"/>
  </g>

  <!-- arrow 1 → 2 -->
  <path class="ink" fill="#FDBA74" stroke-width="2.5" d="M326,236 H352 V224 L374,244 L352,264 V252 H326 Z"/>

  <!-- ===== 2. once per assignment: one file into the template ===== -->
  <ellipse cx="502" cy="332" rx="120" ry="9" fill="#FDBA74" opacity=".45"/>
  <!-- magic wand -->
  <line x1="414" y1="190" x2="452" y2="150" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
  <line x1="444" y1="158" x2="452" y2="150" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <g fill="#FFC53A" class="ink" stroke-width="2">
    <use href="#gmc-setup-sparkle" transform="translate(460,140) scale(1.2)"/>
  </g>
  <g fill="#FB923C"><circle cx="478" cy="128" r="3"/><circle cx="470" cy="112" r="2.2"/><circle cx="488" cy="146" r="2.2"/></g>
  <!-- the new file, floating down -->
  <g transform="translate(532,146) rotate(8) scale(1.15)"><use href="#gmc-setup-file"/></g>
  <path d="M540,184 C544,200 540,212 532,222" fill="none" stroke="#94A3B8" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <!-- the assignment template -->
  <g class="txt">
    <rect class="ink" x="416" y="230" width="172" height="98" rx="14" fill="#FFFFFF"/>
    <rect x="424" y="238" width="156" height="82" rx="9" fill="none" stroke="#F97316" stroke-width="2.5" stroke-dasharray="6 5"/>
    <path d="M416,256 H588" stroke="#1E293B" stroke-width="3"/>
    <circle cx="432" cy="243" r="4" fill="#F87171"/><circle cx="446" cy="243" r="4" fill="#FBBF24"/><circle cx="460" cy="243" r="4" fill="#34D399"/>
    <text x="478" y="288" text-anchor="middle" font-size="14" font-weight="800" fill="#334155">starter</text>
    <text x="478" y="305" text-anchor="middle" font-size="14" font-weight="800" fill="#334155">template</text>
    <g transform="translate(556,292) scale(.72)"><use href="#gmc-setup-file"/></g>
  </g>

  <!-- arrow 2 → 3 -->
  <path class="ink" fill="#FDBA74" stroke-width="2.5" d="M608,236 H634 V224 L656,244 L634,264 V252 H608 Z"/>

  <!-- ===== 3. automatic: every student gets a copy ===== -->
  <ellipse cx="832" cy="332" rx="150" ry="9" fill="#86EFAC" opacity=".45"/>
  <g transform="translate(680,132)"><use href="#gmc-setup-card"/></g>
  <g transform="translate(784,132)"><use href="#gmc-setup-card"/></g>
  <g transform="translate(888,132)"><use href="#gmc-setup-card"/></g>
  <g transform="translate(680,240)"><use href="#gmc-setup-card"/></g>
  <g transform="translate(784,240)"><use href="#gmc-setup-card"/></g>
  <g transform="translate(888,240)"><use href="#gmc-setup-card"/></g>
  <!-- a different student in each: head, neck and shoulders -->
  <g stroke="#1E293B" stroke-width="2.2" stroke-linejoin="round">
    <!-- long brown hair -->
    <g transform="translate(710,176)">
      <path fill="#5B3A29" d="M-13,-2 C-14,-14 -7,-17 0,-17 C7,-17 14,-14 13,-2 C13,8 14,14 17,19 H-17 C-14,14 -13,8 -13,-2 Z"/>
      <path fill="#F97316" d="M-21,32 C-21,21 -12,16 0,16 C12,16 21,21 21,32 Z"/><path fill="#FDDCB5" d="M-4.5,8 V17 Q0,21 4.5,17 V8 Z"/><ellipse cx="0" cy="0" rx="11" ry="13" fill="#FDDCB5"/>
      <path fill="#5B3A29" d="M-11,-3 C-12,-13 -5,-16 1,-16 C8,-16 12,-11 11,-3 C6,-7 1,-10 -3,-13 C-5,-8 -8,-5 -11,-3 Z"/><g fill="#1E293B" stroke="none"><circle cx="-4.5" cy="1" r="1.6"/><circle cx="4.5" cy="1" r="1.6"/></g><path d="M-7,-3.5 Q-4.5,-5 -2,-4 M2,-4 Q4.5,-5 7,-3.5" fill="none" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round"/><path d="M0.4,2.5 Q-1,5 0.6,5.4" fill="none" stroke="#1E293B" stroke-width="1.2" stroke-linecap="round" stroke-opacity=".55"/><path d="M-3,8 Q0,9.6 3,8" fill="none" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <!-- short black hair -->
    <g transform="translate(814,176)">
      <path fill="#334155" d="M-21,32 C-21,21 -12,16 0,16 C12,16 21,21 21,32 Z"/><path fill="#C68642" d="M-4.5,8 V17 Q0,21 4.5,17 V8 Z"/><ellipse cx="0" cy="0" rx="11" ry="13" fill="#C68642"/>
      <path fill="#111827" d="M-11,-4 C-12,-13 -6,-16 1,-16 C8,-16 12,-12 11,-4 C9,-8 5,-10 0,-10 C-5,-10 -9,-8 -11,-4 Z"/><g fill="#1E293B" stroke="none"><circle cx="-4.5" cy="1" r="1.6"/><circle cx="4.5" cy="1" r="1.6"/></g><path d="M-7,-3.5 Q-4.5,-5 -2,-4 M2,-4 Q4.5,-5 7,-3.5" fill="none" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round"/><path d="M0.4,2.5 Q-1,5 0.6,5.4" fill="none" stroke="#1E293B" stroke-width="1.2" stroke-linecap="round" stroke-opacity=".55"/><path d="M-3,8 Q0,9.6 3,8" fill="none" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <!-- curly hair, short beard -->
    <g transform="translate(918,176)">
      <path fill="#0D9488" d="M-21,32 C-21,21 -12,16 0,16 C12,16 21,21 21,32 Z"/><path fill="#8D5524" d="M-4.5,8 V17 Q0,21 4.5,17 V8 Z"/>
      <g fill="#1F2937"><circle cx="-9" cy="-9" r="6"/><circle cx="-3" cy="-13" r="6.5"/><circle cx="4" cy="-13" r="6.5"/><circle cx="10" cy="-9" r="6"/><circle cx="-11" cy="-2" r="4.5"/><circle cx="11" cy="-2" r="4.5"/></g>
      <ellipse cx="0" cy="0" rx="11" ry="13" fill="#8D5524"/>
      <path fill="#1F2937" d="M-10.5,1 C-10.5,11 -5,15 0,15 C5,15 10.5,11 10.5,1 C9,6 5,9.5 0,9.5 C-5,9.5 -9,6 -10.5,1 Z"/><g fill="#1E293B" stroke="none"><circle cx="-4.5" cy="1" r="1.6"/><circle cx="4.5" cy="1" r="1.6"/></g><path d="M-7,-3.5 Q-4.5,-5 -2,-4 M2,-4 Q4.5,-5 7,-3.5" fill="none" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round"/><path d="M0.4,2.5 Q-1,5 0.6,5.4" fill="none" stroke="#1E293B" stroke-width="1.2" stroke-linecap="round" stroke-opacity=".55"/><path d="M-3,7.4 Q0,8.8 3,7.4" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <!-- hijab -->
    <g transform="translate(710,284)">
      <path fill="#7C3AED" d="M-21,32 C-21,21 -12,16 0,16 C12,16 21,21 21,32 Z"/>
      <path fill="#0D9488" d="M-14,0 C-15,-14 -8,-18 0,-18 C8,-18 15,-14 14,0 C14,10 12,15 19,21 H-19 C-12,15 -14,10 -14,0 Z"/>
      <ellipse cx="0" cy="1" rx="9.5" ry="11.5" fill="#E8B48A"/><g fill="#1E293B" stroke="none"><circle cx="-4.5" cy="1" r="1.6"/><circle cx="4.5" cy="1" r="1.6"/></g><path d="M-7,-3.5 Q-4.5,-5 -2,-4 M2,-4 Q4.5,-5 7,-3.5" fill="none" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round"/><path d="M0.4,2.5 Q-1,5 0.6,5.4" fill="none" stroke="#1E293B" stroke-width="1.2" stroke-linecap="round" stroke-opacity=".55"/><path d="M-3,8 Q0,9.6 3,8" fill="none" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <!-- red hair, ponytail -->
    <g transform="translate(814,284)">
      <path fill="#B45309" d="M8,-5 C19,-4 22,7 15,15 C16,5 13,0 7,-1 Z"/>
      <path fill="#2563EB" d="M-21,32 C-21,21 -12,16 0,16 C12,16 21,21 21,32 Z"/><path fill="#FDDCB5" d="M-4.5,8 V17 Q0,21 4.5,17 V8 Z"/><ellipse cx="0" cy="0" rx="11" ry="13" fill="#FDDCB5"/>
      <path fill="#B45309" d="M-11,-3 C-12,-13 -6,-16 1,-16 C8,-16 12,-12 11,-3 C5,-8 -3,-10 -9,-7 C-10,-5 -10.5,-4 -11,-3 Z"/><g fill="#1E293B" stroke="none"><circle cx="-4.5" cy="1" r="1.6"/><circle cx="4.5" cy="1" r="1.6"/></g><path d="M-7,-3.5 Q-4.5,-5 -2,-4 M2,-4 Q4.5,-5 7,-3.5" fill="none" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round"/><path d="M0.4,2.5 Q-1,5 0.6,5.4" fill="none" stroke="#1E293B" stroke-width="1.2" stroke-linecap="round" stroke-opacity=".55"/><path d="M-3,8 Q0,9.6 3,8" fill="none" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <!-- cap -->
    <g transform="translate(918,284)">
      <path fill="#64748B" d="M-21,32 C-21,21 -12,16 0,16 C12,16 21,21 21,32 Z"/><path fill="#F1C27D" d="M-4.5,8 V17 Q0,21 4.5,17 V8 Z"/><ellipse cx="0" cy="0" rx="11" ry="13" fill="#F1C27D"/>
      <path fill="#2563EB" d="M-11.5,-5 C-11.5,-14 -6,-18 0,-18 C6,-18 11.5,-14 11.5,-5 Z"/>
      <path fill="#2563EB" d="M8,-7 H19 A3,3 0 0 1 19,-1 H8 Z"/><g fill="#1E293B" stroke="none"><circle cx="-4.5" cy="1" r="1.6"/><circle cx="4.5" cy="1" r="1.6"/></g><path d="M-7,-3.5 Q-4.5,-5 -2,-4 M2,-4 Q4.5,-5 7,-3.5" fill="none" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round"/><path d="M0.4,2.5 Q-1,5 0.6,5.4" fill="none" stroke="#1E293B" stroke-width="1.2" stroke-linecap="round" stroke-opacity=".55"/><path d="M-3,8 Q0,9.6 3,8" fill="none" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ===== captions ===== -->
  <g class="txt" text-anchor="middle">
    <text class="ttl" x="170" y="384">Create and store your</text>
    <text class="ttl" x="170" y="406">AI provider key</text>
    <text class="sub" x="170" y="428">in your GitHub organization</text>

    <text class="ttl" x="502" y="384">Add GrillMyCode to</text>
    <text class="ttl" x="502" y="406">the starter template</text>
    <text class="sub" x="502" y="428">one file, written by the Workflow Wizard</text>

    <text class="ttl" x="832" y="384">Every student gets a copy</text>
    <text class="sub" x="832" y="406">when they accept the assignment</text>
  </g>
</svg>
