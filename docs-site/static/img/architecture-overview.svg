<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="gmc-arch-title">
  <title id="gmc-arch-title">One run, start to finish, and what happens when each stage goes wrong. It reads the inputs (fails the run); resolves the tag and commit range (fails the run); identifies the student (warns, and skips the answer key); lists and filters the changed files (if nothing is left, it ends early, successfully by default); reads, strips and marks the code (fails if nothing is readable); builds the prompt; calls the AI and checks the reply (fails after retries); renders the report and PDF (a PDF problem only warns); posts the issue (fails the run); writes to the instructor repository (an error, but the job passes); and labels the repository (warns).</title>
  <style>
    .txt{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .ttl{font-size:14px;font-weight:800;fill:#1E293B}
    .sub{font-size:13px;font-weight:600;fill:#475569}
    .ink{stroke:#1E293B;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
  </style>
  <defs>
    <path id="gmc-arch-sparkle" d="M0,-10 C1,-3 3,-1 10,0 C3,1 1,3 0,10 C-1,3 -3,1 -10,0 C-3,-1 -1,-3 0,-10 Z"/>
    <path id="gmc-arch-r" d="M-5,-7 L3,0 L-5,7" fill="none" stroke="#475569" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="gmc-arch-l" d="M5,-7 L-3,0 L5,7" fill="none" stroke="#475569" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1000" height="500" rx="32" fill="#FFF7ED"/>
  <g fill="#FFC53A">
    <use href="#gmc-arch-sparkle" transform="translate(966,34) scale(.6)"/>
  </g>
  <text class="txt" x="24" y="44" font-size="17" font-weight="800" fill="#1E293B">One run, start to finish</text>
  <text class="txt sub" x="266" y="44">coloured by what happens if the stage goes wrong</text>

  <g class="txt">
    <clipPath id="gmc-arch-c24-70"><rect x="24" y="70" width="176" height="112" rx="14"/></clipPath>
    <rect x="24" y="70" width="176" height="112" rx="14" fill="#FFFFFF"/>
    <rect x="24" y="70" width="176" height="10" fill="#DC2626" clip-path="url(#gmc-arch-c24-70)"/>
    <rect x="24" y="70" width="176" height="112" rx="14" fill="none" stroke="#1E293B" stroke-width="2.5"/>
    <text x="38" y="104" font-size="12" font-weight="800" fill="#94A3B8">1</text>
    <text class="ttl" x="38" y="124">Reads the</text>
    <text class="ttl" x="38" y="142">inputs</text>
    <rect x="34" y="152" width="156" height="22" rx="11" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
    <text x="112.0" y="167" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991B1B">fails the run</text>
  </g>
  <use href="#gmc-arch-r" x="210" y="126"/>
  <g class="txt">
    <clipPath id="gmc-arch-c218-70"><rect x="218" y="70" width="176" height="112" rx="14"/></clipPath>
    <rect x="218" y="70" width="176" height="112" rx="14" fill="#FFFFFF"/>
    <rect x="218" y="70" width="176" height="10" fill="#DC2626" clip-path="url(#gmc-arch-c218-70)"/>
    <rect x="218" y="70" width="176" height="112" rx="14" fill="none" stroke="#1E293B" stroke-width="2.5"/>
    <text x="232" y="104" font-size="12" font-weight="800" fill="#94A3B8">2</text>
    <text class="ttl" x="232" y="124">Resolves the tag</text>
    <text class="ttl" x="232" y="142">and commit range</text>
    <rect x="228" y="152" width="156" height="22" rx="11" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
    <text x="306.0" y="167" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991B1B">fails the run</text>
  </g>
  <use href="#gmc-arch-r" x="404" y="126"/>
  <g class="txt">
    <clipPath id="gmc-arch-c412-70"><rect x="412" y="70" width="176" height="112" rx="14"/></clipPath>
    <rect x="412" y="70" width="176" height="112" rx="14" fill="#FFFFFF"/>
    <rect x="412" y="70" width="176" height="10" fill="#D97706" clip-path="url(#gmc-arch-c412-70)"/>
    <rect x="412" y="70" width="176" height="112" rx="14" fill="none" stroke="#1E293B" stroke-width="2.5"/>
    <text x="426" y="104" font-size="12" font-weight="800" fill="#94A3B8">3</text>
    <text class="ttl" x="426" y="124">Identifies</text>
    <text class="ttl" x="426" y="142">the student</text>
