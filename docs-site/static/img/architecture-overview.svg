  <g class="txt">
    <clipPath id="gmc-arch-c606-70"><rect x="606" y="70" width="176" height="112" rx="14"/></clipPath>
    <rect x="606" y="70" width="176" height="112" rx="14" fill="#FFFFFF"/>
    <rect x="606" y="70" width="176" height="10" fill="#64748B" clip-path="url(#gmc-arch-c606-70)"/>
    <rect x="606" y="70" width="176" height="112" rx="14" fill="none" stroke="#1E293B" stroke-width="2.5"/>
