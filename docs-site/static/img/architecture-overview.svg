  <!-- ===== legend ===== -->
  <g class="txt">
    <rect x="24" y="396" width="952" height="80" rx="18" fill="#FFFFFF" fill-opacity=".75"/>
    <rect x="48" y="416" width="16" height="16" rx="4" fill="#DC2626"/><text class="sub" x="72" y="429" style="fill:#1E293B">Fails the run: a red X</text>
    <rect x="300" y="416" width="16" height="16" rx="4" fill="#D97706"/><text class="sub" x="324" y="429" style="fill:#1E293B">Warns and carries on: the student still gets their questions</text>
    <rect x="48" y="446" width="16" height="16" rx="4" fill="#64748B"/><text class="sub" x="72" y="459" style="fill:#1E293B">Ends early without calling the AI: a green tick, unless <tspan font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700">fail_on_empty_assessment</tspan> is on</text>
  </g>
</svg>
