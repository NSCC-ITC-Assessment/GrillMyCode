    <text class="ttl" x="620" y="124">Lists and filters</text>
    <text class="ttl" x="620" y="142">the changed files</text>
    <rect x="616" y="152" width="156" height="22" rx="11" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
    <text x="694.0" y="167" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">if empty: ends early</text>
  </g>
  <use href="#gmc-arch-r" x="792" y="126"/>
  <g class="txt">
    <clipPath id="gmc-arch-c800-70"><rect x="800" y="70" width="176" height="112" rx="14"/></clipPath>
    <rect x="800" y="70" width="176" height="112" rx="14" fill="#FFFFFF"/>
    <rect x="800" y="70" width="176" height="10" fill="#DC2626" clip-path="url(#gmc-arch-c800-70)"/>
    <rect x="800" y="70" width="176" height="112" rx="14" fill="none" stroke="#1E293B" stroke-width="2.5"/>
    <text x="814" y="104" font-size="12" font-weight="800" fill="#94A3B8">5</text>
    <text class="ttl" x="814" y="124">Reads, strips and</text>
