  <use href="#gmc-arch-l" x="662" y="306"/>
  <g class="txt">
    <clipPath id="gmc-arch-c510-250"><rect x="510" y="250" width="142" height="112" rx="14"/></clipPath>
    <rect x="510" y="250" width="142" height="112" rx="14" fill="#FFFFFF"/>
