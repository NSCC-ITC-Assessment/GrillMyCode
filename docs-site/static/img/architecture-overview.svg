  </g>
  <path d="M946,186 V222 Q946,236 932,236 H920" fill="none" stroke="#475569" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M928,229 L920,236 L928,243" fill="none" stroke="#475569" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <g class="txt">
    <clipPath id="gmc-arch-c834-250"><rect x="834" y="250" width="142" height="112" rx="14"/></clipPath>
    <rect x="834" y="250" width="142" height="112" rx="14" fill="#FFFFFF"/>
    <rect x="834" y="250" width="142" height="10" fill="#CBD5E1" clip-path="url(#gmc-arch-c834-250)"/>
    <rect x="834" y="250" width="142" height="112" rx="14" fill="none" stroke="#1E293B" stroke-width="2.5"/>
    <text x="848" y="284" font-size="12" font-weight="800" fill="#94A3B8">6</text>
    <text class="ttl" style="font-size:13px" x="848" y="304">Builds the</text>
    <text class="ttl" style="font-size:13px" x="848" y="322">prompt</text>
  </g>
  <use href="#gmc-arch-l" x="824" y="306"/>
  <g class="txt">
    <clipPath id="gmc-arch-c672-250"><rect x="672" y="250" width="142" height="112" rx="14"/></clipPath>
    <rect x="672" y="250" width="142" height="112" rx="14" fill="#FFFFFF"/>
    <rect x="672" y="250" width="142" height="10" fill="#DC2626" clip-path="url(#gmc-arch-c672-250)"/>
    <rect x="672" y="250" width="142" height="112" rx="14" fill="none" stroke="#1E293B" stroke-width="2.5"/>
    <text x="686" y="284" font-size="12" font-weight="800" fill="#94A3B8">7</text>
    <text class="ttl" style="font-size:13px" x="686" y="304">Calls the AI,</text>
    <text class="ttl" style="font-size:13px" x="686" y="322">checks the reply</text>
    <rect x="682" y="332" width="122" height="22" rx="11" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
    <text x="743.0" y="347" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991B1B">fails after retries</text>
