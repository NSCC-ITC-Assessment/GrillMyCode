<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 612" role="img" aria-labelledby="gmc-trig-title">
  <title id="gmc-trig-title">When each trigger runs GrillMyCode, shown on one student's timeline of six pushes. Trigger option 1, every push: six runs. Trigger option 2, submission tag: one run, at the push tagged "complete". Trigger option 3, manually: one run, when you click Run workflow after the deadline.</title>
  <style>
    .txt{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .ttl{font-size:18px;font-weight:800;fill:#1E293B}
    .sub{font-size:14px;font-weight:600;fill:#475569}
    .ink{stroke:#1E293B;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
    .guide{stroke:#FCD9B6;stroke-width:2.5;stroke-dasharray:3 7;stroke-linecap:round}
  </style>
  <defs>
    <linearGradient id="gmc-trig-flame" x1="205" y1="60" x2="120" y2="295" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FA7A18"/><stop offset="0.45" stop-color="#F13B1F"/><stop offset="1" stop-color="#C8142E"/>
    </linearGradient>
    <linearGradient id="gmc-trig-core" x1="0" y1="140" x2="0" y2="298" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC53A"/><stop offset="1" stop-color="#FB8420"/>
    </linearGradient>
    <path id="gmc-trig-sparkle" d="M0,-10 C1,-3 3,-1 10,0 C3,1 1,3 0,10 C-1,3 -3,1 -10,0 C-3,-1 -1,-3 0,-10 Z"/>
    <!-- one run: a small flame with a face, centred on 0,0 -->
    <g id="gmc-trig-run">
      <g transform="scale(.19) translate(-180,-190)">
        <path class="ink" stroke-width="14" fill="url(#gmc-trig-flame)" d="M184 54C206 80 222 112 214 150C211 164 210 176 214 188C224 180 234 170 237 158C252 180 259 200 258 226C257 268 224 298 180 299C136 299 101 268 101 226C101 186 124 158 152 132C170 114 180 90 184 54Z"/>
        <path fill="url(#gmc-trig-core)" d="M188 138C186 170 184 196 192 214C214 228 223 248 221 266C219 284 210 294 204 298H156C142 290 129 272 129 250C129 212 170 176 188 138Z"/>
        <circle cx="160" cy="226" r="13" fill="#1E293B"/><circle cx="202" cy="226" r="13" fill="#1E293B"/>
        <path d="M164,254 Q181,272 198,254" fill="none" stroke="#1E293B" stroke-width="9" stroke-linecap="round"/>
      </g>
    </g>
    <!-- no run -->
    <circle id="gmc-trig-none" r="6" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1000" height="612" rx="32" fill="#FFF7ED"/>
  <g fill="#FFC53A">
    <use href="#gmc-trig-sparkle" transform="translate(560,40) scale(.7)"/>
    <use href="#gmc-trig-sparkle" transform="translate(965,190) scale(.6)"/>
  </g>

  <!-- ===== the student's week ===== -->
  <!-- student -->
  <g transform="translate(-40,-376)">
    <path class="ink" fill="#F97316" d="M62,548 C62,490 80,496 106,496 C132,496 150,490 150,548 Z"/>
    <path class="ink" fill="#FDDCB5" d="M98,478 V497 Q106,503 114,497 V478 Z"/>
    <g transform="translate(106,490) scale(.86) translate(-106,-492)">
      <path class="ink" fill="#5B3A29" d="M75,468 C72,434 92,422 108,422 C126,422 142,434 138,468 C138,484 141,494 147,502 C136,506 128,502 124,496 L88,496 C84,502 76,506 66,502 C71,494 75,484 75,468 Z"/>
      <ellipse class="ink" cx="106" cy="464" rx="24" ry="28" fill="#FDDCB5"/>
      <path class="ink" fill="#5B3A29" d="M80,464 C76,436 94,428 110,425 C128,432 136,446 133,462 C120,458 106,450 98,440 C94,450 88,458 80,464 Z"/>
      <circle class="ink" cx="126" cy="442" r="4.2" fill="#FFC53A" stroke-width="2.5"/>
      <circle cx="96" cy="467" r="2.6" fill="#1E293B"/><circle cx="116" cy="467" r="2.6" fill="#1E293B"/>
      <path class="ink" fill="none" stroke-width="2.6" d="M100,479 Q106,483 112,479"/>
      <path d="M90,459 Q96,456 101,458.5 M111,458.5 Q116,456 122,459" fill="none" stroke="#1E293B" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M107.0,470 Q104.0,475 107.0,476" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round" stroke-opacity=".5"/>
    </g>
  </g>
  <text class="txt ttl" x="140" y="102">The student</text>
  <text class="txt ttl" x="140" y="124">submits their work</text>

  <!-- guides down from each push -->
  <g class="guide">
    <line x1="360" y1="164" x2="360" y2="556"/>
    <line x1="425" y1="164" x2="425" y2="556"/>
    <line x1="490" y1="164" x2="490" y2="556"/>
    <line x1="555" y1="164" x2="555" y2="556"/>
    <line x1="620" y1="164" x2="620" y2="556"/>
    <line x1="685" y1="164" x2="685" y2="556"/>
    <line x1="765" y1="198" x2="765" y2="556" stroke="#94A3B8"/>
  </g>

  <!-- timeline road -->
  <path d="M340,150 H960" fill="none" stroke="#FCD9B6" stroke-width="22" stroke-linecap="round"/>
  <path d="M340,150 H960" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="10 12" stroke-linecap="round"/>
  <path class="ink" fill="none" d="M946,140 L960,150 L946,160" stroke="#C2410C"/>
  <text class="txt sub" x="958" y="186" text-anchor="end">time</text>

  <!-- the six pushes -->
  <g>
    <circle class="ink" cx="360" cy="150" r="15" fill="#FFFFFF"/>
    <circle class="ink" cx="425" cy="150" r="15" fill="#FFFFFF"/>
    <circle class="ink" cx="490" cy="150" r="15" fill="#FFFFFF"/>
    <circle class="ink" cx="555" cy="150" r="15" fill="#FFFFFF"/>
    <circle class="ink" cx="620" cy="150" r="15" fill="#FFFFFF"/>
    <circle class="ink" cx="685" cy="150" r="15" fill="#FFFFFF"/>
  </g>
  <g fill="none" stroke="#F97316" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M360,157 V143 M354,149 L360,143 L366,149"/>
    <path d="M425,157 V143 M419,149 L425,143 L431,149"/>
    <path d="M490,157 V143 M484,149 L490,143 L496,149"/>
    <path d="M555,157 V143 M549,149 L555,143 L561,149"/>
    <path d="M620,157 V143 M614,149 L620,143 L626,149"/>
    <path d="M685,157 V143 M679,149 L685,143 L691,149"/>
  </g>

  <!-- the "complete" tag on the last push -->
  <g class="txt">
    <line class="ink" x1="685" y1="134" x2="685" y2="100"/>
    <path class="ink" fill="#FFC53A" d="M651,72 H727 A5,5 0 0 1 732,77 V95 A5,5 0 0 1 727,100 H651 L638,86 Z"/>
    <circle cx="652" cy="86" r="3.5" fill="#FFF7ED" class="ink" stroke-width="2"/>
    <text x="694" y="91" text-anchor="middle" font-size="13" font-weight="800" fill="#7C2D12">complete</text>
  </g>

  <!-- deadline -->
  <g class="txt">
    <rect class="ink" x="747" y="118" width="36" height="36" rx="7" fill="#FFFFFF"/>
    <rect x="748.5" y="119.5" width="33" height="10" rx="5" fill="#EF4444"/>
    <path d="M758,114 V124 M772,114 V124" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
    <path d="M756,140 L763,146 L774,134" fill="none" stroke="#1E293B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="765" y="186" text-anchor="middle" font-size="14" font-weight="800" fill="#B91C1C">deadline</text>
  </g>

  <!-- ===== lane 1: every push ===== -->
  <rect x="20" y="214" width="960" height="104" rx="22" fill="#FFFFFF" fill-opacity=".75"/>
  <g transform="translate(0,15)">
    <g class="txt">
      <rect x="92" y="209" width="132" height="22" rx="11" fill="#C2410C"/>
      <text x="158" y="225" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">Trigger option 1</text>
    </g>
    <g transform="translate(58,257)">
      <circle class="ink" r="20" fill="#F97316"/>
      <path d="M0,9 V-9 M-7,-2 L0,-9 L7,-2" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text class="txt ttl" x="92" y="252">Every push</text>
    <text class="txt sub" x="92" y="274">6 runs</text>
    <use href="#gmc-trig-run" x="360" y="257"/>
    <use href="#gmc-trig-run" x="425" y="257"/>
    <use href="#gmc-trig-run" x="490" y="257"/>
    <use href="#gmc-trig-run" x="555" y="257"/>
    <use href="#gmc-trig-run" x="620" y="257"/>
    <use href="#gmc-trig-run" x="685" y="257"/>
    <use href="#gmc-trig-none" x="765" y="257"/>
  
    
  </g>

  <!-- ===== lane 2: submission tag ===== -->
  <rect x="20" y="334" width="960" height="104" rx="22" fill="#FFFFFF" fill-opacity=".75"/>
  <g transform="translate(0,31)">
    <g class="txt">
      <rect x="92" y="313" width="132" height="22" rx="11" fill="#C2410C"/>
      <text x="158" y="329" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">Trigger option 2</text>
    </g>
    <g transform="translate(58,361)">
      <circle class="ink" r="20" fill="#FFC53A"/>
      <path class="ink" fill="#FFFFFF" stroke-width="2.5" d="M-4,-9 H9 V9 H-4 L-11,0 Z"/>
      <circle cx="-3" cy="0" r="2" fill="#1E293B"/>
    </g>
    <text class="txt ttl" x="92" y="356">Submission tag</text>
    <text class="txt sub" x="92" y="378">1 run, when they're done</text>
    <use href="#gmc-trig-none" x="360" y="361"/>
    <use href="#gmc-trig-none" x="425" y="361"/>
    <use href="#gmc-trig-none" x="490" y="361"/>
    <use href="#gmc-trig-none" x="555" y="361"/>
    <use href="#gmc-trig-none" x="620" y="361"/>
    <use href="#gmc-trig-run" x="685" y="361"/>
    <use href="#gmc-trig-none" x="765" y="361"/>
  
    
  </g>

  <!-- ===== lane 3: manually ===== -->
  <rect x="20" y="454" width="960" height="104" rx="22" fill="#FFFFFF" fill-opacity=".75"/>
  <g transform="translate(0,47)">
    <g class="txt">
      <rect x="92" y="417" width="132" height="22" rx="11" fill="#C2410C"/>
      <text x="158" y="433" text-anchor="middle" font-size="13" font-weight="800" fill="#FFFFFF">Trigger option 3</text>
    </g>
    <g transform="translate(58,465)">
      <circle class="ink" r="20" fill="#16A34A"/>
      <path fill="#FFFFFF" d="M-6,-10 L10,1 L-6,11 Z"/>
    </g>
    <text class="txt ttl" x="92" y="460">Manually</text>
    <text class="txt sub" x="92" y="482">1 run, when you choose</text>
    <use href="#gmc-trig-none" x="360" y="465"/>
    <use href="#gmc-trig-none" x="425" y="465"/>
    <use href="#gmc-trig-none" x="490" y="465"/>
    <use href="#gmc-trig-none" x="555" y="465"/>
    <use href="#gmc-trig-none" x="620" y="465"/>
    <use href="#gmc-trig-none" x="685" y="465"/>
    <!-- the Run workflow button, clicked -->
    <g class="txt">
      <rect class="ink" x="795" y="448" width="120" height="34" rx="9" fill="#16A34A" stroke-width="2.5"/>
      <text x="855" y="470" text-anchor="middle" font-size="14" font-weight="800" fill="#FFFFFF">Run workflow</text>
      <path class="ink" fill="#FFFFFF" stroke-width="2.5" d="M896,472 L896,498 L903,491 L909,503 L915,500 L909,489 L919,488 Z"/>
      </g>
    <use href="#gmc-trig-run" x="948" y="465"/>
  
    
  </g>

  <!-- footnote -->
  <text class="txt sub" x="500" y="592" text-anchor="middle">Whichever you choose, you can also start a run yourself at any time.</text>
</svg>
