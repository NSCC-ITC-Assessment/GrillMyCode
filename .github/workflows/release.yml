name: Release

on:
  push:
    tags:
      # "v" then a digit. A plain "v*" matches every tag that starts with "v",
      # which includes the VS Code extension's vscode-v* tags.
      - "v[0-9]*"

jobs:
  snapshot-docs:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GRILLMYCODE_APP_ID }}
          private-key: ${{ secrets.GRILLMYCODE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Extract major version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          MAJOR=$(echo "${TAG#v}" | cut -d. -f1)
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Detect if new major version
        id: detect
        run: |
          MAJOR=${{ steps.version.outputs.major }}
          if [[ -d "docs-site/versioned_docs/version-${MAJOR}" ]]; then
            echo "new_major=false" >> "$GITHUB_OUTPUT"
          else
            echo "new_major=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6
        if: steps.detect.outputs.new_major == 'true'

      - uses: actions/setup-node@v6
        if: steps.detect.outputs.new_major == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml

      - name: Install docs dependencies
        if: steps.detect.outputs.new_major == 'true'
        run: pnpm install --frozen-lockfile
        working-directory: docs-site

      - name: Update existing major version snapshot
        if: steps.detect.outputs.new_major == 'false'
        run: |
          MAJOR=${{ steps.version.outputs.major }}
          echo "Updating existing v${MAJOR} snapshot"
          cp "versioned_docs/version-${MAJOR}/release-notes.md" /tmp/release-notes.md 2>/dev/null || true
          rm -rf "versioned_docs/version-${MAJOR}"
          cp -r docs "versioned_docs/version-${MAJOR}"
          MAJOR="${MAJOR}" node -e "(async()=>{const{default:s}=await import('./sidebars.js');require('fs').writeFileSync('versioned_sidebars/version-'+process.env.MAJOR+'-sidebars.json',JSON.stringify(s,null,2)+'\n');})()"
          [[ -f /tmp/release-notes.md ]] && mv /tmp/release-notes.md "versioned_docs/version-${MAJOR}/release-notes.md"
        working-directory: docs-site

      - name: Create new major version snapshot
        if: steps.detect.outputs.new_major == 'true'
        run: |
          MAJOR=${{ steps.version.outputs.major }}
          echo "Creating new v${MAJOR} snapshot"
          pnpm docusaurus docs:version "${MAJOR}"
        working-directory: docs-site

      - name: Prepend release notes entry
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          gh release view "${TAG}" --json body --jq '.body // ""' > /tmp/release-body.txt
          node << 'EOF'
          const fs = require('fs');
          const tag = process.env.TAG;
          const major = process.env.MAJOR;
          const date = new Date().toISOString().split('T')[0];
          // Release notes are built from commit subjects, which can contain `<` or
          // `{` (e.g. "tag:<name>"). MDX treats those as JSX and fails the docs
          // build, so escape them everywhere except inside inline code spans.
          const body = fs.readFileSync('/tmp/release-body.txt', 'utf8').trim()
            .split(/(`[^`\n]*`)/)
            .map((part, i) => i % 2 ? part : part.replace(/</g, '&lt;').replace(/\{/g, '&#123;'))
            .join('');
          const notesFile = `docs-site/versioned_docs/version-${major}/release-notes.md`;
          const newEntry = `\n## ${tag} — ${date}\n\n${body}\n`;
          if (fs.existsSync(notesFile)) {
            const content = fs.readFileSync(notesFile, 'utf8');
            const updated = content.replace(/^(# .+)$/m, `$1${newEntry}`);
            fs.writeFileSync(notesFile, updated);
          } else {
            const header = `---\nsidebar_label: Release Notes\nsidebar_position: 99\ntoc_max_heading_level: 2\n---\n\n# Release Notes\n`;
            fs.writeFileSync(notesFile, header + newEntry);
          }
          EOF

      - name: Commit and push snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs-site/versioned_docs docs-site/versioned_sidebars docs-site/versions.json
          git commit -m "docs: update v${{ steps.version.outputs.major }} snapshot"
          git push origin main

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          MAJOR=$(echo "$TAG" | cut -d. -f1)
          MINOR=$(echo "$TAG" | cut -d. -f1-2)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"

      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.version.outputs.tag }}
            ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.version.outputs.minor }}
            ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.version.outputs.major }}
            ghcr.io/${{ steps.repo.outputs.name }}:latest
          secrets: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

      - name: Generate categorized release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        # Limited to the action's own tags and files. The editor extensions are
        # released from this repository under other tag prefixes (vscode-v*),
        # so the nearest tag of any name could be one of theirs, and a commit
        # that touches only extensions/ belongs in their notes, not these.
        run: |
          node scripts/release-notes.js --tag "$TAG" --match "v[0-9]*" \
            --path . --path ":(exclude)extensions" --out /tmp/release-body.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: /tmp/release-body.txt

      - name: Update floating version tags
        run: |
          MAJOR=${{ steps.version.outputs.major }}
          MINOR=${{ steps.version.outputs.minor }}
          SHA=$(git rev-list -n1 "${{ steps.version.outputs.tag }}")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${MAJOR}" "${SHA}"
          git tag -f "${MINOR}" "${SHA}"
          git push origin "${MAJOR}" "${MINOR}" --force

      # TEMPORARY: keep @v1 working as an alias of v0 for existing workflows that
      # reference it. To drop it, remove this step and delete the tag
      # (git push origin --delete v1); workflows still on @v1 then fail with
      # "Unable to resolve action", so do it at a term boundary.
      - name: Update legacy v1 alias
        if: steps.version.outputs.major == 'v0'
        run: |
          git tag -f v1 "$(git rev-list -n1 "${{ steps.version.outputs.tag }}")"
          git push origin v1 --force
