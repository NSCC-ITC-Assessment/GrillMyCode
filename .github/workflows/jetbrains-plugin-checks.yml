name: JetBrains Plugin Checks

# Builds the plugin in extensions/jetbrains/, lints its Kotlin, and runs the
# IntelliJ Plugin Verifier against the IDEs it says it supports. The plugin's
# ZIP is attached to the run, so a reviewer can install it by hand ("Install
# Plugin from Disk…" in Settings, Plugins).
#
# Nothing is published. Releases are jetbrains-plugin-release.yml's, on
# jetbrains-v* tags.

on:
  pull_request:
    branches: [main]
    paths:
      - "extensions/jetbrains/**"
      # The sample issues the plugin's reader is tested against.
      - "extensions/fixtures/**"
      - ".github/workflows/jetbrains-plugin-checks.yml"
  # On main too, so the latest merged build is always there to download.
  push:
    branches: [main]
    paths:
      - "extensions/jetbrains/**"
      - "extensions/fixtures/**"
      - ".github/workflows/jetbrains-plugin-checks.yml"

permissions:
  contents: read

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/jetbrains
    steps:
      - uses: actions/checkout@v6

      # Temurin, the JDK the devcontainer has.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Also checks gradle-wrapper.jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v6

      # ktlint, the tests, and the checks on plugin.xml.
      - name: Check
        run: ./gradlew check verifyPluginProjectConfiguration verifyPluginStructure

      - name: Build
        run: ./gradlew buildPlugin

      - name: Attach the plugin
        uses: actions/upload-artifact@v7
        with:
          name: grillmycode-jetbrains
          path: extensions/jetbrains/build/distributions/*.zip
          if-no-files-found: error

  # A job of its own: it downloads several IDEs, each over a gigabyte.
  verify:
    name: Plugin Verifier
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/jetbrains
    steps:
      # The IDEs do not fit in the space a runner starts with.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: false
          large-packages: false

      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # The IDEs are too large to be worth caching.
          cache-read-only: true

      - name: Run the Plugin Verifier
        run: ./gradlew verifyPlugin

      - name: Attach the verifier's reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-reports
          path: extensions/jetbrains/build/reports/pluginVerifier
          if-no-files-found: ignore
