name: JetBrains Plugin Checks

# Builds the plugin in extensions/jetbrains/, lints its Kotlin, and runs the
# IntelliJ Plugin Verifier against the IDEs it says it supports. The plugin's
# ZIP is attached to the run, so a reviewer can install it by hand ("Install
# Plugin from Disk…" in Settings, Plugins).
#
# The verifier runs only when the plugin's Kotlin or Gradle files change: it
# checks the compiled classes against each IDE's API, which nothing else on the
# list below can change. On a pull request it checks the oldest and newest IDE,
# and on main every IDE JetBrains recommends, as the release workflow does.
#
# Nothing is published. Releases are jetbrains-plugin-release.yml's, on
# jetbrains-v* tags.

on:
  pull_request:
    branches: [main]
    paths:
      - "extensions/jetbrains/**"
      # The sample issues and workflow cases the plugin is tested against.
      - "extensions/fixtures/**"
      # The Workflow Wizard, which the plugin bundles as the VS Code extension
      # builds it, and the constants the two share.
      - "docs-site/docs/_workflow-wizard/**"
      - "docs-site/static/img/grillmycode-wizard.svg"
      - "extensions/vscode/src/webview/**"
      - "extensions/vscode/src/shared/**"
      - "extensions/vscode/esbuild.js"
      - "extensions/vscode/package.json"
      - "extensions/vscode/pnpm-lock.yaml"
      # The workflows the docs show, which the input checks must pass.
      - "docs-site/docs/**"
      - "README.md"
      - ".github/workflows/jetbrains-plugin-checks.yml"
  # On main too, so the latest merged build is always there to download.
  push:
    branches: [main]
    paths:
      - "extensions/jetbrains/**"
      - "extensions/fixtures/**"
      - "docs-site/docs/_workflow-wizard/**"
      - "docs-site/static/img/grillmycode-wizard.svg"
      - "extensions/vscode/src/webview/**"
      - "extensions/vscode/src/shared/**"
      - "extensions/vscode/esbuild.js"
      - "extensions/vscode/package.json"
      - "extensions/vscode/pnpm-lock.yaml"
      - "docs-site/docs/**"
      - "README.md"
      - ".github/workflows/jetbrains-plugin-checks.yml"

permissions:
  contents: read

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/jetbrains
    steps:
      - uses: actions/checkout@v6

      # Temurin, the JDK the devcontainer has.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Also checks gradle-wrapper.jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v6

      # The Workflow Wizard's page is the VS Code extension's bundle, built by
      # its esbuild.js (build.gradle.kts), so its packages are installed too.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: extensions/vscode/pnpm-lock.yaml

      - name: Install the VS Code extension's packages
        working-directory: extensions/vscode
        run: pnpm install --frozen-lockfile

      # ktlint, the tests, and the checks on plugin.xml.
      - name: Check
        run: ./gradlew check verifyPluginProjectConfiguration verifyPluginStructure

      - name: Build
        run: ./gradlew buildPlugin

      - name: Attach the plugin
        uses: actions/upload-artifact@v7
        with:
          name: grillmycode-jetbrains
          path: extensions/jetbrains/build/distributions/*.zip
          if-no-files-found: error

  # Whether the plugin's code changed, which is all the verifier checks. Its
  # tests are left out, since the verifier never sees them.
  changes:
    name: Plugin code changed
    runs-on: ubuntu-latest
    outputs:
      plugin: ${{ steps.diff.outputs.plugin }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The full history, without file contents, so the diff below can
          # reach the commit a push started from.
          fetch-depth: 0
          filter: blob:none

      - name: List the changed files
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # The checkout is GitHub's merge of the pull request, whose first
            # parent is the base branch.
            range="HEAD^1 HEAD"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE HEAD"
          else
            # A push whose earlier commit isn't known: verify to be safe.
            echo "plugin=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # shellcheck disable=SC2086 # range is two commits
          if git diff --name-only $range | grep -qE '^(extensions/jetbrains/(src/main/|gradle/|build\.gradle\.kts$|settings\.gradle\.kts$|gradle\.properties$)|\.github/workflows/jetbrains-plugin-checks\.yml$)'; then
            echo "plugin=true" >> "$GITHUB_OUTPUT"
          else
            echo "plugin=false" >> "$GITHUB_OUTPUT"
            echo "The plugin's Kotlin and Gradle files are unchanged, so the verifier is skipped."
          fi

  # A job of its own: it downloads IDEs, each over a gigabyte. A skipped run
  # counts as passing, so this can still be a required check.
  verify:
    name: Plugin Verifier
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/jetbrains
    steps:
      # The IDEs do not fit in the space a runner starts with.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: false
          large-packages: false

      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # The IDEs are too large to be worth caching.
          cache-read-only: true

      # The Workflow Wizard's page is the VS Code extension's bundle, built by
      # its esbuild.js (build.gradle.kts), so its packages are installed too.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: extensions/vscode/pnpm-lock.yaml

      - name: Install the VS Code extension's packages
        working-directory: extensions/vscode
        run: pnpm install --frozen-lockfile

      # A pull request checks the two ends of the supported range; main checks
      # them all (verifyOldestAndNewest in build.gradle.kts).
      - name: Run the Plugin Verifier
        env:
          VERIFY_ARGS: ${{ github.event_name == 'pull_request' && '-PverifyOldestAndNewest' || '' }}
        run: |
          # shellcheck disable=SC2086 # VERIFY_ARGS is empty or one flag
          ./gradlew verifyPlugin $VERIFY_ARGS

      - name: Attach the verifier's reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-reports
          path: extensions/jetbrains/build/reports/pluginVerifier
          if-no-files-found: ignore
