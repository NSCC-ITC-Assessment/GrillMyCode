name: Build and Push Docker Image (Staging)

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs-site/**"
      - "README.md"
      - "AGENTS.md"
      - "_prompt-archive/**"
      - "action.yml"
      - ".github/CODEOWNERS"
      - ".github/SECURITY.md"
      - ".github/copilot-instructions.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/prompts/**"
      - ".github/workflows/branch-build.yml"
      - ".github/workflows/deploy-docs.yml"
      - ".github/workflows/pr-checks-docs.yml"
      - ".github/workflows/pr-checks.yml"
      - ".github/workflows/refresh-gitignore-templates.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/renovate.yml"
      - ".devcontainer/**"
      - ".vscode/**"
      - ".husky/**"
      - ".claude/**"
      - ".mcp.json"
      - "commitlint.config.cjs"
      - "eslint.config.js"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".gitignore"
      - ".gitattributes"
      - ".npmrc"
      - "src/data/gitignore-templates.json"
      - "renovate.json"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Lowercase repo
        id: repo
        run: |
          echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push STAGING image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:next
          secrets: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
