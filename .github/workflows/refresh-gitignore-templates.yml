name: Refresh gitignore templates

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GRILLMYCODE_APP_ID }}
          private-key: ${{ secrets.GRILLMYCODE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fetch latest templates
        run: node scripts/fetch-gitignore-templates.js
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Format output file
        run: pnpm prettier --write src/data/gitignore-templates.json

      - name: Open PR if templates changed
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/refresh-gitignore-templates
          title: "chore: refresh gitignore templates"
          body: |
            Automated refresh of `src/data/gitignore-templates.json` from [github/gitignore](https://github.com/github/gitignore).

            No changes to the file means this PR will not be created.
          commit-message: "chore: refresh gitignore templates"
          labels: dependencies
