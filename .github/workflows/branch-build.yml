name: Build and Push Docker Image (Branch)

on:
  push:
    branches-ignore:
      - main
    tags-ignore:
      - "v*"
    paths-ignore:
      - "docs-site/**"
      - "README.md"
      - "_prompt-archive/**"
      - "action.yml"
      - ".github/**"
      - ".devcontainer/**"
      - ".vscode/**"
      - ".husky/**"
      - "commitlint.config.cjs"
      - "eslint.config.js"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".gitignore"
      - ".npmrc"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Sanitize branch name for Docker tag
        id: tag
        run: |
          SAFE=$(echo '${{ github.ref_name }}' | sed 's/[^a-zA-Z0-9._-]/-/g' | sed 's/-\+/-/g' | sed 's/^-\|-$//g')
          echo "value=$SAFE" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.tag.outputs.value }}

      - name: Update action.yml image reference
        run: |
          sed -i "s|image: \"docker://ghcr.io/${{ steps.repo.outputs.name }}:.*\"|image: \"docker://ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.tag.outputs.value }}\"|" action.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add action.yml
          git diff --staged --quiet || git commit -m "chore: update image reference to ${{ steps.tag.outputs.value }} [skip ci]"
          git push
