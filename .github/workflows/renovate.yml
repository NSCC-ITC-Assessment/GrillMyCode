name: Renovate

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GRILLMYCODE_APP_ID }}
          private-key: ${{ secrets.GRILLMYCODE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6

      - name: Run Renovate
        uses: renovatebot/github-action@v46.1.14
        env:
          RENOVATE_REPOSITORIES: nscc-itc-assessment/GrillMyCode
        with:
          configurationFile: renovate.json
          token: ${{ steps.app-token.outputs.token }}
