version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # This image is self-managed — the release workflow pins it to an
      # immutable tag on each release. Dependabot must not overwrite it.
      - dependency-name: "ghcr.io/nscc-itc-assessment/grillmycode"
