<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="gmc-ext-title">
  <title id="gmc-ext-title">How the pieces of the student side of the extension relate. On GitHub, nothing changes: the student pushes their code, the GrillMyCode action runs, and it posts an issue of questions in the student's repository, with the file and lines on each snippet. The instructor repository, which holds the answers, is never read. In VS Code, the extension works in order: it takes the folder open in VS Code (the student's clone), signs in to GitHub using VS Code's own sign-in, finds the questions issue by its assessment label, reads out each question with its file, lines and commit, and matches it to lines in the file, spotting code that has moved. The student then sees a questions panel in the side bar, each question pinned to its lines, and a warning when the code has moved on from the reviewed commit. Optionally, later, GrillMyCode could write the same details into the issue as hidden data.</title>
