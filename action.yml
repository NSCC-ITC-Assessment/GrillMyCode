name: "Grill My Code"
description: >
  Analyses code changes submitted via GitHub and uses AI to generate targeted
  comprehension questions for spoken or written assessments. Created to promote 
  code comprehension and critical thinking in NSCC's ITC courses, but adaptable to 
  various educational contexts.
author: "NSCC-ITC"
branding:
  icon: "book-open"
  color: "blue"

# ─── Inputs ──────────────────────────────────────────────────────────────────

inputs:
  github_token:
    description: >
      GitHub token used for API access and as the credential for GitHub Models.
      Defaults to the built-in GITHUB_TOKEN.
    required: true
    default: ${{ github.token }}

  ai_provider:
    description: >
      AI provider to use for question generation.
      Supported values: github-models | openai | openrouter | azure-openai
    required: false
    default: "github-models"

  ai_model:
    description: >
      Model identifier for the chosen provider.
      GitHub Models : gpt-4.1
      OpenAI examples        : gpt-4o, gpt-4-turbo
      Azure OpenAI           : your deployment name
    required: false
    default: "gpt-4.1"

  ai_retry_max_attempts:
    description: >
      Total number of attempts (initial attempt plus retries) when calling the
      AI provider. Retries are triggered by transient errors: 429 (rate limit),
      500, 502, 503, 504, and network-level failures. A 429 response with a
      Retry-After header is honoured; all other retryable errors use
      exponential backoff with full jitter. Values below 1 are clamped to 1.
    required: false
    default: "5"

  ai_temperature:
    description: >
      Controls the randomness of the AI's output (0.0 = fully deterministic,
      1.0 = most random). Lower values produce more predictable, consistent
      questions; higher values produce more varied output. Most users should
      leave this at the default.
    required: false
    default: "0.5"

  api_key:
    description: >
      API key for the chosen AI provider.
      For github-models, leave empty to use github_token automatically, or supply a
      Personal Access Token (e.g. an instructor token with an alternative license)
      to use that instead.
    required: false
    default: ""

  azure_endpoint:
    description: >
      Full Azure OpenAI endpoint URL, required only when ai_provider is azure-openai.
      Example: https://my-resource.openai.azure.com/openai/deployments/my-deployment
    required: false
    default: ""

  num_questions:
    description: "Number of comprehension questions to generate (minimum 1, maximum 50). Supplied values above 50 are automatically capped to 50."
    required: false
    default: "20"

  include_answers:
    description: >
      When true, each question is immediately followed by its answer, labelled
      "Answer:", in the student-facing report. This means the student sees the
      answers — defeating the purpose of the assessment, which is for the
      student to determine the answers themselves. Leave this false in almost
      all cases. The instructor repository (when instructor_repo_token is
      configured) always includes answers regardless of this setting.
    required: false
    default: "false"

  include_patterns:
    description: >
      Comma-separated glob patterns for files to include in the assessment.
      Leave empty to include all non-excluded files.
      Example: "*.py,*.js,src/**"
    required: false
    default: ""

  exclude_patterns:
    description: >
      Comma-separated glob patterns for files to exclude from the assessment.
      Defaults to common non-code files (lock files, images, build artefacts,
      Markdown files, etc.). WARNING: providing a value here completely replaces
      the default list — it does not extend it. You are responsible for
      re-including any patterns you still want excluded (e.g. node_modules/**,
      **/*.md, **/*.png).
    required: false
    default: ""

  output_file:
    description: >
      Basename for the assessment Markdown file. The file is always written
      under the .assessment/ folder in the repository root (e.g.
      grill-my-code.md → .assessment/grill-my-code.md) and committed back to
      the repository via the GitHub Contents API.
    required: false
    default: "grill-my-code.md"

  post_pr_comment:
    description: >
      Post the assessment as a comment on the pull request when the workflow is
      triggered by a pull_request or issue_comment event.
      Set to "false" to disable.
    required: false
    default: "true"

  post_issue:
    description: >
      Create a GitHub Issue in the repository containing the assessment questions.
      If an open issue for the same branch already exists, it is updated in place
      (title, body) rather than replaced, preserving issue history and comments.
      Set to "true" to enable.
    required: false
    default: "false"

  post_discussion:
    description: >
      Create a GitHub Discussion in the repository containing the assessment
      questions. If Discussions are not enabled on the repository, the action
      enables them automatically.
      Set to "true" to enable.
    required: false
    default: "false"

  discussion_category:
    description: >
      The name of the Discussion category to post into.
      The category must already exist in the repository's Discussions settings.
      Example: "Assessments"
    required: false
    default: "Assessments"

  instructor_repo_token:
    description: >
      Personal Access Token (PAT) with repo scope and permission to create
      repositories in the same organisation as the student repositories.
      When provided, the action writes a private instructor-only assessment
      file (questions and answers) to a repository named
      {assignment-name}-grillmycode-instructor in the same organisation. The repository
      is created automatically on first run if it does not already exist.
      Leave empty to disable instructor repository delivery.
    required: false
    default: ""

  assignment_context:
    description: >
      Comma-separated file glob(s) whose contents are read from the repository
      and injected into the AI prompt as assignment context. Useful for
      automatically including README files, assignment briefs, or style guides.
      Supported file types: plain text and source files (any UTF-8 text),
      PDF (.pdf — text layer only, images ignored), and Microsoft Word
      (.doc/.docx — text content only, images ignored).
      Globs are matched against the full relative path from the repository root,
      so subdirectory paths and wildcards work (e.g. "docs/assignment.md", "**/*.md").
      If no files match, a workflow warning is emitted and the action continues
      without assignment context.
      Example: "README.md, docs/assignment.md, coding_style.md"
    required: false
    default: ""

  assignment_context_max_chars:
    description: >
      Maximum total characters read from all assignment_context files combined.
      Prevents extremely large context files from flooding the AI prompt.
      Values below 1 are clamped to 1.
    required: false
    default: "20000"

  additional_context:
    description: >
      Free-text context about the assignment or topic being assessed. Helps the
      AI generate more relevant, targeted questions.
      Example: "Assignment 3 — Python list comprehensions and lambda functions"
    required: false
    default: ""

  skip_initial_commit:
    description: >
      When true (the default), the diff base is pinned to the repository's very
      first commit so that starter/template files are excluded from assessment.
      When false, the base is set to the empty tree regardless of the event type,
      so the initial commit's files are included in the assessed diff.
    required: false
    default: "true"

  exclude_workflow_files:
    description: >
      When true (the default), files under .github/workflows/ are excluded from
      the assessed diff. Set to "false" to include workflow files so they can
      be subject to comprehension questions.
    required: false
    default: "true"

  keep_comments:
    description: >
      When false (the default), inline and block comments are stripped from the
      submitted code before it is sent to the AI. Set to "true" to preserve
      comments exactly as written.
    required: false
    default: "false"

  skip_committers:
    description: >
      Comma-separated list of commit author names or email substrings.
      Any consecutive commits at the start of the assessed range (immediately
      after the resolved base SHA) whose author name or email contains one of
      these values are excluded from the diff. Matching is case-insensitive.

      This handles the automated commits that GitHub Classroom applies to a
      student repository when the assignment is accepted (e.g. feedback PR
      setup, autograder configuration) so they are never included in the
      assessed diff.

      Only consecutive leading commits are skipped — if a bot commit appears
      after a student commit it is included as normal.

      Set to an empty string ('') to disable bot-commit skipping entirely.
    required: false
    default: "github-classroom[bot],github-actions[bot]"

  base_sha:
    description: >-
      Override the base commit SHA for the diff. When provided this takes
      precedence over skip_initial_commit. Auto-detected when not provided.
    required: false
    default: ""

  head_sha:
    description: >-
      Override the head commit SHA for the diff. Only applied when base_sha is
      also provided — both must be set together for the manual override to take
      effect. Auto-detected when not provided.
    required: false
    default: ""

# ─── Outputs ─────────────────────────────────────────────────────────────────

outputs:
  output_file:
    description: "Workspace-relative path to the generated assessment Markdown file."
  questions:
    description: "The raw generated questions as a string."
  code_before_strip:
    description: "The full code content of all assessed files before comment stripping."
  code_after_strip:
    description: "The full code content of all assessed files after comment stripping."

# ─── Execution ────────────────────────────────────────────────────────────────

runs:
  using: "docker"
  # This tag is a dev placeholder — the release workflow replaces it with an
  # immutable patch tag (e.g. :v1.0.3) each time a version tag is pushed.
  # Consumers pinning to GrillMyCode@v1 always resolve to the released image.
  image: "docker://ghcr.io/nscc-itc-assessment/grillmycode:latest"
  env:
    INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
    INPUT_AI_PROVIDER: ${{ inputs.ai_provider }}
    INPUT_AI_MODEL: ${{ inputs.ai_model }}
    INPUT_AI_RETRY_MAX_ATTEMPTS: ${{ inputs.ai_retry_max_attempts }}
    INPUT_AI_TEMPERATURE: ${{ inputs.ai_temperature }}
    INPUT_API_KEY: ${{ inputs.api_key }}
    INPUT_AZURE_ENDPOINT: ${{ inputs.azure_endpoint }}
    INPUT_NUM_QUESTIONS: ${{ inputs.num_questions }}
    INPUT_INCLUDE_PATTERNS: ${{ inputs.include_patterns }}
    INPUT_EXCLUDE_PATTERNS: ${{ inputs.exclude_patterns }}
    INPUT_EXCLUDE_WORKFLOW_FILES: ${{ inputs.exclude_workflow_files }}
    INPUT_OUTPUT_FILE: ${{ inputs.output_file }}
    INPUT_POST_PR_COMMENT: ${{ inputs.post_pr_comment }}
    INPUT_POST_ISSUE: ${{ inputs.post_issue }}
    INPUT_POST_DISCUSSION: ${{ inputs.post_discussion }}
    INPUT_DISCUSSION_CATEGORY: ${{ inputs.discussion_category }}
    INPUT_ASSIGNMENT_CONTEXT: ${{ inputs.assignment_context }}
    INPUT_ASSIGNMENT_CONTEXT_MAX_CHARS: ${{ inputs.assignment_context_max_chars }}
    INPUT_ADDITIONAL_CONTEXT: ${{ inputs.additional_context }}
    INPUT_SKIP_INITIAL_COMMIT: ${{ inputs.skip_initial_commit }}
    INPUT_KEEP_COMMENTS: ${{ inputs.keep_comments }}
    INPUT_SKIP_COMMITTERS: ${{ inputs.skip_committers }}
    INPUT_BASE_SHA: ${{ inputs.base_sha }}
    INPUT_HEAD_SHA: ${{ inputs.head_sha }}
    INPUT_INCLUDE_ANSWERS: ${{ inputs.include_answers }}
    INPUT_INSTRUCTOR_REPO_TOKEN: ${{ inputs.instructor_repo_token }}
