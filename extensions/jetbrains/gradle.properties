group = org.grillmycode

# The release workflow checks a jetbrains-v* tag against this. A suffix names
# the Marketplace channel the version goes to: 0.1.0-eap.1 goes to "eap", which
# only people who add that channel receive. No suffix goes to the default
# channel, which every install updates to.
version = 0.1.0-eap.2

# The oldest IDE the plugin installs in, as a build number: 251 is 2025.1. The
# plugin compiles against that release, so it cannot call anything newer.
pluginSinceBuild = 251
platformVersion = 2025.1.7

# The IDE provides the Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
